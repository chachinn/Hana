name: Hana routine-first skincare import release

on:
  push:
    paths:
      - '.github/workflows/hana-skincare-routine-first.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply routine-first skincare patch
        run: python .github/scripts/hana_skincare_routine_first_patch.py

      - name: Run skincare parser regression QA
        run: python .github/scripts/hana_skincare_routine_first_qa.py

      - name: Commit completed release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hana-skincare-routine-first.yml .github/scripts/hana_skincare_routine_first_patch.py .github/scripts/hana_skincare_routine_first_qa.py
          git add app.js index.html service-worker.js
          git commit -m "Hana: recognize routine-first skincare schedules"
          git push origin HEAD:main
