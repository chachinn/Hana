name: Hana Quick Capture line-break fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply Quick Capture line break fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix literal newline placeholders
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('\\\\n','&#10;'),encoding='utf-8')"
      - name: Verify
        run: |
          grep -q 'quickCaptureInput' index.html
          grep -q '&#10;' index.html
          if grep -Fq '\\n' index.html; then echo 'Literal newline escape still present in index.html'; exit 1; fi
      - name: Commit fix
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-quick-capture-linebreak-fix.yml quick-capture-fix.txt
          git add index.html
          git diff --cached --check
          git commit -m "Fix Quick Capture multiline placeholder"
          git push origin HEAD:main
