name: Hana Smart Library production release

on:
  push:
    paths:
      - '.github/workflows/hana-smart-library-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Smart Library patch
        run: python .github/scripts/hana_smart_library_patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Targeted Smart Sort and template QA
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text()
          index=Path('index.html').read_text()
          css=Path('style.css').read_text()
          sw=Path('service-worker.js').read_text()

          checks={
            'runtime version':'const HANA_APP_VERSION = "2.0.36";' in app,
            'recipe smart sort':'recipe:"🍳 Recipe Card' in app,
            'itinerary smart sort':'"travel-itinerary":"🗺️ Travel Itinerary' in app,
            'workout smart sort':'workout:"🏋️ Workout Plan' in app,
            'study smart sort':'"study-plan":"📚 Study Plan' in app,
            'medication smart sort':'medication:"💊 Medication / Supplement Schedule' in app,
            'file import':'id="brainDumpFileInput"' in app and 'importBrainDumpFile' in app,
            'json local import':'importedJSONToText' in app,
            'template search':'id="templateSearchInput"' in app and 'filterTemplateLibrary' in app,
            'recipe template':'id:"recipe-card"' in app,
            'travel template':'id:"travel-itinerary"' in app,
            'workout template':'id:"workout-plan"' in app,
            'habit template':'id:"habit-tracker"' in app,
            'application template':'id:"application-tracker"' in app,
            'bookmark template':'id:"bookmark-library"' in app,
            'blank template safety':'Template preview · not saved yet' in app,
            'index version':'content="2.0.36"' in index and 'app.js?v=2.0.36' in index,
            'service worker':'hana-shell-v69' in sw and 'app.js?v=2.0.36' in sw,
            'smart css':'HANA 2.0.36 · SMART LIBRARY' in css,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('FAILED: '+', '.join(failed))

          # Every added template card must be routed by an extended definition.
          ids=['daily-routine-list','cleaning-checklist','travel-day-checklist','event-planning-checklist','recipe-card','project-brief','event-brief','travel-itinerary','workout-plan','study-plan','medication-schedule','meal-planner','habit-tracker','reading-list','watch-list','subscription-tracker','application-tracker','delivery-tracker','home-inventory','content-calendar','decision-log','contact-list','bookmark-library']
          missing=[x for x in ids if f'id:"{x}"' not in app or f'"{x}"' not in app]
          if missing: raise SystemExit('Missing template routing: '+', '.join(missing))

          # File import is intentionally bounded for mobile stability.
          assert 'file.size>1500000' in app
          assert '.txt,.md,.csv,.tsv,.json,.html,.htm' in app
          print('Targeted Smart Library QA passed')
          PY

      - name: Repository consistency check
        run: |
          git diff --check
          ! grep -R "2.0.35" index.html service-worker.js app.js | grep -E "hana-app-version|style.css\?v=|app.js\?v=|HANA_APP_VERSION" || exit 1

      - name: Commit completed release
        run: |
          rm -f .github/scripts/hana_smart_library_patch.py
          rm -f .github/workflows/hana-smart-library-release.yml
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Hana: expand Smart Sort and template library"
          git push origin main
