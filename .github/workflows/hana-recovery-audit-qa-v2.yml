name: Hana recovery safety QA v2

on:
  push:
    branches:
      - agent/hana-recovery-audit
    paths:
      - .github/workflows/hana-recovery-audit-qa-v2.yml

permissions:
  contents: write

jobs:
  recovery-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hana-recovery-audit
          fetch-depth: 0

      - name: Wire recovery guard into Version 1 shell
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          if 'recovery-safety.js?v=1.0.0-data-safe-1' not in text:
              old = '  <script src="firebase-bridge.js?v=1.0.0"></script>\n  <script src="app.js?v=1.0.0"></script>'
              new = '  <script src="firebase-bridge.js?v=1.0.0"></script>\n  <script src="recovery-safety.js?v=1.0.0-data-safe-1"></script>\n  <script src="app.js?v=1.0.0"></script>'
              if old not in text: raise SystemExit('Expected Version 1 script block not found')
              index.write_text(text.replace(old,new,1))

          sw = Path('service-worker.js')
          text = sw.read_text()
          if 'hana-shell-v1-data-safe-1' not in text:
              text = text.replace('HANA 🌸 Service Worker v1 · Version 1 baseline','HANA 🌸 Service Worker v1 · data-safety revision 1',1)
              text = text.replace('const CACHE_NAME = "hana-shell-v1";','const CACHE_NAME = "hana-shell-v1-data-safe-1";',1)
          if 'recovery-safety.js?v=1.0.0-data-safe-1' not in text:
              old='  "./firebase-bridge.js?v=1.0.0",\n  "./smart-templates.js?v=1.0.0"'
              new='  "./firebase-bridge.js?v=1.0.0",\n  "./recovery-safety.js?v=1.0.0-data-safe-1",\n  "./smart-templates.js?v=1.0.0"'
              if old not in text: raise SystemExit('Service worker shell marker missing')
              text=text.replace(old,new,1)
          sw.write_text(text)
          PY

      - name: Static data-safety QA
        run: |
          node --check app.js
          node --check firebase-bridge.js
          node --check recovery-safety.js
          node --check smart-templates.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'const STORAGE_KEY = "hana_app_v1"' app.js
          grep -q 'recovery-safety.js?v=1.0.0-data-safe-1' index.html
          grep -q 'const CACHE_NAME = "hana-shell-v1-data-safe-1"' service-worker.js
          git diff --check

      - name: Install browser driver
        run: npm install --prefix /tmp/hana-recovery-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-recovery-http.log 2>&1 &
          sleep 2

      - name: iPhone-sized recovery and regression QA
        env:
          NODE_PATH: /tmp/hana-recovery-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath)throw new Error('No browser executable found');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',error=>errors.push(String(error.stack||error)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1400);
            await page.evaluate(()=>{try{closeModal('accountWelcomeModal')}catch(_){}});

            const identity=await page.evaluate(()=>({app:HANA_APP_VERSION,display:HANA_DISPLAY_VERSION,storage:STORAGE_KEY,backupDb:BACKUP_DB_NAME,recovery:window.HanaRecoveryAudit?.status?.()||null,catalog:window.HANA_SMART_TEMPLATE_CATALOG?.length||0}));
            if(identity.app!=='1.0.0'||identity.display!=='1'||identity.storage!=='hana_app_v1'||identity.backupDb!=='hana_safety_backups_v1')throw new Error('Version/storage identity changed '+JSON.stringify(identity));
            if(!identity.recovery?.hooksInstalled||!identity.recovery?.nonDestructiveAuthCleanup)throw new Error('Recovery guard missing '+JSON.stringify(identity));
            if(identity.catalog<45)throw new Error('Smart Template Garden regressed');

            const safety=await page.evaluate(async()=>{
              const space=state.spaces[0]?.id||'personal';
              state.notes=(state.notes||[]).filter(note=>!['qa-shared-note','qa-missing-note'].includes(note.id));
              state.notes.push(normalizeNote({id:'qa-shared-note',title:'Partner note must survive auth loss',content:'shared local copy',space,sharedWithPartner:true,sharedLinkId:'qa-link'}));
              state.currentMode='shared';
              const cleanupResult=await cleanupSharedLocalForSignedOut();
              const sharedSurvived=state.notes.some(note=>note.id==='qa-shared-note'&&note.sharedWithPartner===true);
              const modeSafe=state.currentMode==='all';
              const snapshotState=clone(state);
              snapshotState.notes.push(normalizeNote({id:'qa-missing-note',title:'Missing note from safety copy',content:'recoverable text',space,sharedWithPartner:true,sharedLinkId:'qa-link'}));
              await createSafetySnapshot('pre-account-signout',JSON.stringify(snapshotState),{force:true});
              const beforeScan=JSON.stringify(state.notes);
              const report=await window.HanaRecoveryAudit.scanMissingNotes();
              const afterScan=JSON.stringify(state.notes);
              return {cleanupResult,sharedSurvived,modeSafe,scanReadOnly:beforeScan===afterScan,preSignoutCount:report.preSignoutCount,found:report.candidates.some(entry=>entry.note?.id==='qa-missing-note')};
            });
            if(!safety.sharedSurvived||!safety.modeSafe||!safety.scanReadOnly||!safety.found||safety.preSignoutCount<1)throw new Error('Recovery behavior failed '+JSON.stringify(safety));

            await page.evaluate(()=>window.HanaRecoveryAudit.open());
            await page.waitForTimeout(100);
            const auditText=await page.locator('#hanaRecoveryAuditModal').innerText();
            if(!auditText.includes('Missing note from safety copy')||!auditText.includes('Nothing is restored automatically'))throw new Error('Recovery audit UI failed');

            const pages=[['today','Focus Bouquet'],['tasks','Tasks'],['notes','Notes'],['lists','Lists'],['settings','Settings']];
            for(const [name,marker] of pages){await page.evaluate(p=>changePage(p),name);await page.waitForTimeout(70);const text=await page.locator('#pageContent').innerText();if(!text.includes(marker))throw new Error(`${name} failed to render`);}
            if(await page.locator('#hanaRecoveryAuditButton').count()!==1)throw new Error('Recovery audit button missing from Settings');
            if(errors.length)throw new Error('Browser runtime errors: '+errors.join(' | '));
            await browser.close();
            console.log('Hana recovery safety QA v2 passed',JSON.stringify({identity,safety}));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Commit recovery safety wiring to QA branch
        run: |
          git config user.name "Hana Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add recovery-safety.js index.html service-worker.js
          git diff --check --cached
          if git diff --cached --quiet; then echo "No wiring changes needed"; else git commit -m "Hana: wire non-destructive recovery safety"; git push origin HEAD:agent/hana-recovery-audit; fi
