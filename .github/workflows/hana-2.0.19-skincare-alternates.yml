name: Hana 2.0.19 skincare alternate routines

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply skincare update
        run: python scripts/hana-2.0.19-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Skincare compatibility QA
        run: node scripts/hana-2.0.19-qa.js

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.19"' index.html
          grep -q 'style.css?v=2.0.19' index.html
          grep -q 'app.js?v=2.0.19' index.html
          grep -q 'hana-shell-v52' service-worker.js
          grep -q 'data-skincare-add-variant' app.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-2.0.19-skincare-alternates.yml scripts/hana-2.0.19-patch.py scripts/hana-2.0.19-qa.js
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Release Hana 2.0.19 with alternate skincare routines"
          git push origin HEAD:main
