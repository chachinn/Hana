name: Hana browser runtime smoke

on:
  push:
    paths:
      - app.js
      - index.html
      - style.css
      - smart-templates.js
      - smart-templates.css
      - service-worker.js
      - .github/workflows/hana-runtime-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check smart-templates.js

      - name: Install lightweight browser driver
        run: npm install --prefix /tmp/hana-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-http.log 2>&1 &
          sleep 2

      - name: iPhone-sized startup and Smart Template smoke
        env:
          NODE_PATH: /tmp/hana-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('No browser executable found');

          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox']});
            const context = await browser.newContext({
              viewport:{width:430,height:932}, deviceScaleFactor:3, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error.stack || error)));
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            await page.evaluate(()=>{ try { closeModal('accountWelcomeModal'); } catch (_) {} });

            let text = await page.locator('#pageContent').innerText();
            const identity = await page.evaluate(()=>({
              app:HANA_APP_VERSION,
              display:HANA_DISPLAY_VERSION,
              release:HANA_RELEASE_NOTES.version,
              meta:document.querySelector('meta[name="hana-app-version"]')?.content || '',
              storage:STORAGE_KEY,
              backupDb:BACKUP_DB_NAME,
              backupMeta:BACKUP_META_KEY,
              catalog:window.HANA_SMART_TEMPLATE_CATALOG?.length || 0,
              profiles:Object.keys(window.HANA_EXPANDED_SMART_PROFILES || {}).length
            }));
            if (identity.app !== '1.0.0' || identity.display !== '1' || identity.release !== '1' || identity.meta !== '1.0.0') throw new Error('Hana Version 1 identity regressed: '+JSON.stringify(identity));
            if (identity.storage !== 'hana_app_v1' || identity.backupDb !== 'hana_safety_backups_v1' || identity.backupMeta !== 'hana_backup_meta_v1') throw new Error('Hana Version 1 storage identity regressed: '+JSON.stringify(identity));
            if (identity.catalog < 45 || identity.profiles < 20) throw new Error('Smart Template Garden regressed: '+JSON.stringify(identity));
            if (!/Focus Bouquet|Nothing urgent|active/i.test(text)) throw new Error('Today failed to render');

            const pages = [['tasks','Tasks'],['lists','Lists'],['calendar','Calendar'],['notes','Notes'],['tables','Trackers'],['projects','Projects'],['inbox','Brain Dump'],['templates','Templates'],['settings','Settings']];
            for (const [name, marker] of pages) {
              await page.evaluate(pageName => changePage(pageName), name);
              await page.waitForTimeout(70);
              text = await page.locator('#pageContent').innerText();
              if (!text.includes(marker)) throw new Error(`${name} failed to render`);
            }

            const smart = await page.evaluate(()=>({
              wedding:smartStructuredCaptureKind('Wedding Planner\nVenue:\nBook venue'),
              hair:smartStructuredCaptureKind('Haircare Schedule\nMonday:\nShampoo | Test'),
              trip:smartStructuredCaptureKind('Trip Prep\nDocuments:\nPassport'),
              bills:smartStructuredCaptureKind('Bills Schedule\nInternet | 1000 | 2026-08-25'),
              medical:smartStructuredCaptureKind('Medical Appointment Prep\nQuestions:\nAsk about test'),
              packing:smartStructuredCaptureKind('Travel packing\nTop\nShoes\nPassport\nCharger'),
              skincare:skincareTextLooksStructured('Morning Routine\nDaily\nCleanser → Sample\nToner → Sample\nMoisturizer → Sample\nSunscreen → Sample',{allowSingleDay:false})
            }));
            const expected = {wedding:'wedding-planner',hair:'haircare',trip:'trip-prep',bills:'bills-schedule',medical:'medical-prep',packing:'packing'};
            for (const [key,value] of Object.entries(expected)) if (smart[key] !== value) throw new Error(`Smart detection ${key} regressed: ${smart[key]}`);
            if (!smart.skincare) throw new Error('Skincare recognition regressed');

            const packing = await page.evaluate(()=>{
              const sample=['Travel packing','Top','Shoes','Charger','Deo','Passport','Sunscreen'].join('\n');
              const items=smartListItemsFromText(sample,'packing');
              state.settings.packingCategoryMemory={};
              const before=smartPackingCategory('Cloud Nine Wand');
              rememberPackingCategory('Cloud Nine Wand','💇 Hair Care & Styling');
              return {
                categoryCount:SMART_PACKING_CATEGORY_ORDER.length,
                titles:items.map(item=>item.title),
                categories:Object.fromEntries(items.map(item=>[item.title,item.detail])),
                before,
                learned:smartPackingCategory('Cloud Nine Wand (travel size)')
              };
            });
            if (packing.categoryCount !== 21 || !packing.titles.includes('Deodorant')) throw new Error('Packing structure regressed');
            if (packing.categories.Top !== '👗 Clothing' || packing.categories.Shoes !== '👟 Footwear' || packing.categories.Passport !== '🪪 Documents & Money' || packing.categories.Sunscreen !== '✨ Skincare & Sun Care') throw new Error('Packing categorization regressed');
            if (packing.before !== '🧳 Other' || packing.learned !== '💇 Hair Care & Styling') throw new Error('Packing category learning regressed');

            await page.evaluate(()=>openSmartTemplateTutorial());
            await page.waitForTimeout(80);
            const guide = await page.evaluate(()=>({
              visible:!document.getElementById('smartTemplateTutorialModal')?.classList.contains('hidden'),
              cards:document.querySelectorAll('[data-smart-paste-card]').length,
              savedExampleValues:[...document.querySelectorAll('#smartTemplateTutorialModal input, #smartTemplateTutorialModal textarea')].map(el=>el.value).filter(Boolean)
            }));
            if (!guide.visible || guide.cards < 45 || guide.savedExampleValues.length) throw new Error('Smart Paste Guide safety regressed: '+JSON.stringify(guide));

            await page.evaluate(()=>changePage('templates'));
            await page.waitForTimeout(60);
            if (await page.locator('.smart-template-library-hero').count() !== 1) throw new Error('Templates Smart Paste Guide entry missing');
            await page.evaluate(()=>changePage('inbox'));
            await page.waitForTimeout(60);
            if (await page.locator('.brain-dump-smart-guide-link').count() !== 1) throw new Error('Brain Dump Smart Paste Guide entry missing');

            if (errors.length) throw new Error('Browser runtime errors: '+errors.join(' | '));
            await browser.close();
            console.log('Hana Version 1 iPhone Smart Template smoke passed', JSON.stringify({identity,smart,guide}));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
