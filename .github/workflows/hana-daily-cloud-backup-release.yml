name: Hana daily cloud backup release

on:
  push:
    paths:
      - .github/workflows/hana-daily-cloud-backup-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply production patch
        run: python3 .github/scripts/hana_daily_cloud_backup_patch.py

      - name: Syntax and consistency
        run: |
          node --check app.js
          grep -q '2.0.39' app.js
          grep -q '2.0.39' index.html
          grep -q 'hana-shell-v72' service-worker.js
          grep -q 'maybeRunAutomaticCloudBackup' app.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' app.js
          git diff --check

      - name: Install browser driver
        run: npm install --prefix /tmp/hana-cloud-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-cloud-http.log 2>&1 &
          sleep 2

      - name: iPhone runtime and cloud scheduler QA
        env:
          NODE_PATH: /tmp/hana-cloud-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('No browser executable found');
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox']});
            const context = await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            let text=await page.locator('#pageContent').innerText();
            if(!/Focus Bouquet|Nothing urgent|active/i.test(text))throw new Error('Today failed to render');

            const result=await page.evaluate(async()=>{
              localStorage.removeItem(CLOUD_AUTO_BACKUP_META_KEY);
              localStorage.removeItem(CLOUD_BACKUP_BASELINE_KEY);
              let backups=[];
              firebaseReady=async()=>({
                backupSnapshot:async(uid,payload)=>{backups.push({uid,payload});return {savedAt:new Date().toISOString(),sizeBytes:100,chunkCount:1};}
              });

              hanaAccountState.status='ready';
              hanaAccountState.user={uid:'qa-google',email:'google@example.com',providerData:[{providerId:'google.com'}]};
              hanaAccountState.meta=null;
              const before=await maybeRunAutomaticCloudBackup({now:new Date(2026,7,14,7,59),force:true,showToast:false});
              const after=await maybeRunAutomaticCloudBackup({now:new Date(2026,7,14,8,0),force:true,showToast:false});
              const repeat=await maybeRunAutomaticCloudBackup({now:new Date(2026,7,14,9,0),force:true,showToast:false});
              const googleCount=backups.length;

              localStorage.removeItem(CLOUD_AUTO_BACKUP_META_KEY);
              localStorage.removeItem(CLOUD_BACKUP_BASELINE_KEY);
              backups=[];
              hanaAccountState.user={uid:'qa-email',email:'email@example.com',providerData:[{providerId:'password'}]};
              hanaAccountState.meta={savedAt:new Date().toISOString(),sizeBytes:100,chunkCount:1};
              const protectedResult=await maybeRunAutomaticCloudBackup({now:new Date(2026,7,14,9,0),force:true,showToast:false});
              const protectedCount=backups.length;
              const manual=await backupHanaToCloud({quiet:true,confirmReplace:false});
              const baselineReady=cloudBackupBaselineReady(hanaAccountState.user);
              localStorage.removeItem(CLOUD_AUTO_BACKUP_META_KEY);
              const emailAuto=await maybeRunAutomaticCloudBackup({now:new Date(2026,7,14,9,5),force:true,showToast:false});
              const emailCount=backups.length;
              return {before,after,repeat,googleCount,protectedResult,protectedCount,manual,baselineReady,emailAuto,emailCount};
            });

            if(result.before!==false)throw new Error('Auto backup ran before 8 AM');
            if(result.after!==true||result.googleCount!==1)throw new Error('Google daily backup did not run exactly once after 8 AM');
            if(result.repeat!==true||result.googleCount!==1)throw new Error('Same-day duplicate backup was not suppressed');
            if(result.protectedResult!==false||result.protectedCount!==0)throw new Error('Existing cloud backup was overwritten before device confirmation');
            if(result.manual!==true||result.baselineReady!==true)throw new Error('Manual email backup did not establish device baseline');
            if(result.emailAuto!==true||result.emailCount!==2)throw new Error('Email sign-in daily auto backup did not run after baseline confirmation');
            if(errors.length)throw new Error('Browser runtime errors: '+errors.join(' | '));
            console.log('Daily cloud backup behavioral QA passed',JSON.stringify(result));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Commit production files
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html service-worker.js
          git commit -m "Hana: add daily 8 AM cloud backups"
          git push origin main
