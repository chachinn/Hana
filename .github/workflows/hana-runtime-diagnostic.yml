name: Hana runtime diagnostic

on:
  push:
    paths:
      - '.github/workflows/hana-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser driver only
        run: npm install --no-save --package-lock=false playwright-core
      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-http.log 2>&1 &
          echo $! > /tmp/hana-http.pid
          sleep 2
      - name: iPhone-sized startup smoke test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=candidates.find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium/Chrome executable found on runner');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const context=await browser.newContext({
              viewport:{width:430,height:932},
              deviceScaleFactor:3,
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',err=>{errors.push(String(err.stack||err)); console.error('PAGEERROR:',err.stack||err);});
            page.on('console',msg=>{if(msg.type()==='error') console.error('CONSOLE:',msg.text());});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>({
              bodyText:document.body.innerText.slice(0,3000),
              pageContentText:document.getElementById('pageContent')?.innerText||'',
              pageContentHTML:document.getElementById('pageContent')?.innerHTML||'',
              modeBarText:document.getElementById('modeBar')?.innerText||'',
              version:document.querySelector('meta[name="hana-app-version"]')?.content||''
            }));
            console.log('VERSION',result.version);
            console.log('MODEBAR',JSON.stringify(result.modeBarText));
            console.log('PAGECONTENT',JSON.stringify(result.pageContentText.slice(0,1200)));
            console.log('PAGECONTENT_HTML_LENGTH',result.pageContentHTML.length);
            if(errors.length) throw new Error(`Browser runtime errors: ${errors.join('\n---\n')}`);
            if(!result.pageContentText.trim() || result.pageContentHTML.length<80) throw new Error('Hana main content did not render');
            if(!/Focus Bouquet|Good |active|Nothing urgent|Today/i.test(result.pageContentText)) throw new Error('Today screen markers missing');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
