          regex_once(
              'app.js',
              r'function skincareRoutineBatchEditor\(routine="am", variant="primary", rows=\[\]\) \{.*?\n\}\nfunction skincareOptionalAlternateEditor',
              '''function skincareRoutineBatchEditor(routine="am", variant="primary", rows=[]) {
