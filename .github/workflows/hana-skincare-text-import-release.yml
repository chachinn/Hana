          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const source=fs.readFileSync('app.js','utf8');
          const start=source.indexOf('const SKINCARE_WEEKDAYS =');
          const end=source.indexOf('function normalizeSkincareRoutine');
          if(start<0||end<=start)throw new Error('Unable to isolate skincare parser');
          const sample=`📅 Monday – Acne Control (Azelaic)

AM
* Cleanser: Melano CC Vitamin C Brightening Enzyme Face Wash
* Cream: SEOUL 1988 Capsule Cream (Niacinamide 5% + Yuja)

PM
* Spot Treatment: Lion Pair Acne Cream (active pimples only)

⸻

📅 Tuesday – Exfoliation Night

AM
* Cleanser: Melano CC Vitamin C Brightening Enzyme Face Wash

PM (Week A)
* Toner: Y.O.U. 7% Acid Deep Exfoliating Toner
* Serum: COSRX The Alpha Arbutin 2 Discoloration Care Serum

PM (Week B)
* Treatment: Dr. Melaxin Exfoliating White Rice Ampoule
* Moisturizer: Centellian24 Madeca Mela Capture Ampoule Capsule Cream`;
          const test=source.slice(start,end)+`\nconst __result=parseSkincareRoutineText(${JSON.stringify(sample)},{allowSingleDay:false});\nif(!__result)throw new Error('Parser returned null');\nif(__result.dayCount!==2)throw new Error('Expected 2 days, got '+__result.dayCount);\nif(__result.dayLabels[1]!=='Acne Control (Azelaic)')throw new Error('Monday label lost');\nif(__result.dayLabels[2]!=='Exfoliation Night')throw new Error('Tuesday label lost');\nconst tue=__result.days[2];\nif(!tue.some(x=>x.routineLabel==='Week A'&&x.variant==='primary'))throw new Error('Week A not mapped to primary');\nif(!tue.some(x=>x.routineLabel==='Week B'&&x.variant==='alternate'))throw new Error('Week B not mapped to alternate');\nconst spot=__result.days[1].find(x=>x.category==='Spot Treatment');\nif(!spot||spot.notes!=='active pimples only'||spot.product.includes('active pimples only'))throw new Error('Usage note extraction failed');\nconst cream=__result.days[1].find(x=>x.category==='Moisturizer / Cream');\nif(!cream||!cream.product.includes('(Niacinamide 5% + Yuja)'))throw new Error('Ingredient parentheses were stripped');\nif(!skincareTextLooksStructured(${JSON.stringify(sample)},{allowSingleDay:false}))throw new Error('Detection failed');`;
          vm.runInNewContext(test,{console});
          console.log('PASS formatted skincare parser');
          NODE

