name: Hana formatted skincare import release

on:
  push:
    paths:
      - '.github/workflows/hana-skincare-text-import-release.yml'

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Run Hana formatted skincare import release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover and apply release patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path='.github/workflows/hana-skincare-text-import-release.yml'
          source=subprocess.check_output(['git','show',f'HEAD^:{path}'],text=True)
          start_marker="          python - <<'PY'\n"
          end_marker="\n          PY\n"
          start=source.index(start_marker)+len(start_marker)
          end=source.index(end_marker,start)
          lines=source[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/hana_skincare_patch.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/hana_skincare_patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Formatted skincare parser regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          source=Path('app.js').read_text(encoding='utf-8')
          start=source.index('const SKINCARE_WEEKDAYS =')
          end=source.index('function normalizeSkincareRoutine',start)
          sample='''📅 Monday – Acne Control (Azelaic)

AM
* Cleanser: Melano CC Vitamin C Brightening Enzyme Face Wash
* Cream: SEOUL 1988 Capsule Cream (Niacinamide 5% + Yuja)

PM
* Spot Treatment: Lion Pair Acne Cream (active pimples only)

⸻

📅 Tuesday – Exfoliation Night

AM
* Cleanser: Melano CC Vitamin C Brightening Enzyme Face Wash

PM (Week A)
* Toner: Y.O.U. 7% Acid Deep Exfoliating Toner
* Serum: COSRX The Alpha Arbutin 2 Discoloration Care Serum

PM (Week B)
* Treatment: Dr. Melaxin Exfoliating White Rice Ampoule
* Moisturizer: Centellian24 Madeca Mela Capture Ampoule Capsule Cream'''
          block=source[start:end]
          test=block+f'''\nconst __sample={json.dumps(sample)};
          const __result=parseSkincareRoutineText(__sample,{{allowSingleDay:false}});
          if(!__result)throw new Error('Parser returned null');
          if(__result.dayCount!==2)throw new Error('Expected two days');
          if(__result.dayLabels[1]!=='Acne Control (Azelaic)')throw new Error('Monday label lost');
          if(__result.dayLabels[2]!=='Exfoliation Night')throw new Error('Tuesday label lost');
          if(!__result.days[2].some(x=>x.routineLabel==='Week A'&&x.variant==='primary'))throw new Error('Week A mapping failed');
          if(!__result.days[2].some(x=>x.routineLabel==='Week B'&&x.variant==='alternate'))throw new Error('Week B mapping failed');
          const __spot=__result.days[1].find(x=>x.category==='Spot Treatment');
          if(!__spot||__spot.notes!=='active pimples only'||__spot.product.includes('active pimples only'))throw new Error('Usage note extraction failed');
          const __cream=__result.days[1].find(x=>x.category==='Moisturizer / Cream');
          if(!__cream||!__cream.product.includes('(Niacinamide 5% + Yuja)'))throw new Error('Ingredient parentheses lost');
          if(!skincareTextLooksStructured(__sample,{{allowSingleDay:false}}))throw new Error('Structured detection failed');
          console.log('PASS formatted skincare parser');\n'''
          Path('/tmp/hana_skincare_parser_test.js').write_text(test,encoding='utf-8')
          PY
          node /tmp/hana_skincare_parser_test.js

      - name: Targeted release QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          checks={
            'internal 2.0.31':'const HANA_APP_VERSION = "2.0.31";' in app,
            'public stays Version 2':'const HANA_DISPLAY_VERSION = "2";' in app,
            'parser present':'function parseSkincareRoutineText' in app and 'function createSkincareRoutineNoteFromText' in app,
            'day labels preserved':'dayLabels' in app and 'skincareDayLabel' in html,
            'routine labels preserved':'routineLabel' in app,
            'paste UI':'skincareImportText' in html and 'data-skincare-import-text' in html,
            'Brain Dump skincare destination':'{value:"skincare",label:"🧴 Skincare planner"}' in app,
            'smart capture detection':'formatted routine detected' in app,
            'CSS import card':'FORMATTED SKINCARE IMPORT v2.0.31' in css,
            'cache v64':'hana-shell-v64' in sw,
            'service worker app version':'app.js?v=2.0.31' in sw,
            'index cache bust':'app.js?v=2.0.31' in html and 'style.css?v=2.0.31' in html,
          }
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'),name)
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('QA failed: '+', '.join(failed))
          PY
          git diff --check

      - name: Commit completed release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hana-skincare-text-import-release.yml
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: import formatted skincare routines"
          git push origin HEAD:main
