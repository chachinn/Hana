name: Hana packing category learning release

on:
  push:
    paths:
      - .github/workflows/hana-packing-learning-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply production patch
        run: python3 .github/scripts/hana_packing_learning_patch.py

      - name: Syntax and repository consistency
        run: |
          node --check app.js
          grep -q 'internal build 2.0.41' app.js
          grep -q 'const HANA_APP_VERSION = "2.0.41"' app.js
          grep -q 'hana-app-version" content="2.0.41"' index.html
          grep -q 'listItemPackingCategory' index.html
          grep -q 'packingCategoryMemory' app.js
          grep -q 'SMART_PACKING_CATEGORY_ORDER' app.js
          grep -q 'hana-shell-v74' service-worker.js
          grep -q 'style.css?v=2.0.41' service-worker.js
          grep -q 'app.js?v=2.0.41' service-worker.js
          git diff --check

      - name: Install lightweight browser driver
        run: npm install --prefix /tmp/hana-packing-learning-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-packing-learning-http.log 2>&1 &
          sleep 2

      - name: iPhone runtime and packing learning QA
        env:
          NODE_PATH: /tmp/hana-packing-learning-pw/node_modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/hana_packing_learning_qa.js')
          text=path.read_text()
          marker="  await page.waitForTimeout(900);"
          insert="  await page.waitForTimeout(900);\n  await page.evaluate(()=>{try{closeModal('accountWelcomeModal');}catch(_error){document.getElementById('accountWelcomeModal')?.classList.add('hidden');}});"
          if marker not in text:
              raise SystemExit('QA first-run marker missing')
          text=text.replace(marker,insert,1)
          close_marker="  await page.locator('[data-close-modal=\"listItemModal\"]').click();"
          close_insert="  await page.evaluate(()=>closeModal('listItemModal'));"
          if close_marker not in text:
              raise SystemExit('QA modal-close marker missing')
          path.write_text(text.replace(close_marker,close_insert,1))
          PY
          node .github/scripts/hana_packing_learning_qa.js

      - name: Commit production files
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: add editable learning packing categories"
          git push origin main
