name: Hana 2 AM cutoff note consistency fix

on:
  push:
    paths:
      - '.github/workflows/hana-skincare-2am-note-fix.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct release note boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          old='From 6:00 PM through 3:59 AM, the shortcut opens today’s night routine first.'
          new='From 6:00 PM through 1:59 AM, the shortcut opens today’s night routine first.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old night-boundary note, got {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Run consistency QA
        shell: bash
        run: |
          node --check app.js
          grep -F 'return hour >= 18 || hour < 2 ? "pm" : "am";' app.js
          grep -F 'From 2:00 AM through 5:59 PM' app.js
          grep -F 'From 6:00 PM through 1:59 AM' app.js

      - name: Commit consistency fix
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hana-skincare-2am-note-fix.yml
          git add app.js
          git commit -m "Hana: align skincare cutoff notes with 2 AM"
          git push origin HEAD:main
