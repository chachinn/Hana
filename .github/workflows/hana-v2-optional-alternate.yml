name: Hana Version 2 optional skincare alternate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply update
        run: python scripts/hana-v2-optional-alternate-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Version and skincare QA
        run: node scripts/hana-v2-optional-alternate-qa.js

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.20"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'hana-shell-v53' service-worker.js
          grep -q 'skincareOptionalAlternateEditor' app.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-v2-optional-alternate.yml scripts/hana-v2-optional-alternate-patch.py scripts/hana-v2-optional-alternate-qa.js
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Keep skincare alternates optional and show Hana Version 2"
          git push origin HEAD:main
