name: Hana preview-first templates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    if: github.event.head_commit.message == 'Run preview-first template release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply template draft update
        run: python scripts/hana-template-drafts-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Template persistence regression QA
        run: python scripts/hana-template-drafts-qa.py

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.22"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'Template preview · not saved yet' app.js
          grep -q 'hana-shell-v55' service-worker.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-template-drafts.yml scripts/hana-template-drafts-patch.py scripts/hana-template-drafts-qa.py
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Make Hana templates preview-only until saved"
          git push origin HEAD:main
