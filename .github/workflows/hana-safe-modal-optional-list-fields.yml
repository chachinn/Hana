name: Hana safe modal and optional list fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    if: github.event.head_commit.message == 'Run Hana safe modal and optional list fields release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply update
        run: python scripts/hana-safe-modal-optional-list-fields-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Run QA
        run: python scripts/hana-safe-modal-optional-list-fields-qa.py

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.27"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'hana-shell-v60' service-worker.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-safe-modal-optional-list-fields.yml scripts/hana-safe-modal-optional-list-fields-patch.py scripts/hana-safe-modal-optional-list-fields-qa.py
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Fix template modal safe area and optional list fields"
          git push origin HEAD:main
