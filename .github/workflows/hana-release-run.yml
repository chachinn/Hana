name: Hana release runner

on:
  push:
    paths:
      - '.github/workflows/hana-release-run.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/hana-release-temp.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/hana_patch.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/hana_patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Targeted regression QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          checks={
            'Version 2 remains public':'const HANA_DISPLAY_VERSION = "2";' in app,
            'internal 2.0.30':'const HANA_APP_VERSION = "2.0.30";' in app,
            'structured minutes':'meetingDecisionItems' in html and 'readMeetingDecisionItems' in app,
            'bionote removed from gallery':'{ id:"professional-bionote", icon:"👤", title:"Professional Bionote"' not in app,
            'bionote legacy support retained':'"professional-bionote": {' in app,
            'smarter Brain Dump':'brainDumpDestination' in app and 'data-inbox-destination' in app,
            'Pomodoro':'POMODORO_STORAGE_KEY' in app and 'pomodoroCardHTML()' in app,
            'quick Undo':'}, 2100);' in app,
            'tracker touch tolerance':'now-lastTableTap.time<=480' in app and 'Math.abs(dx)>18' in app,
            'skincare mobile containment':'#skincareRoutineModal .skincare-routine-table' in css,
            'cache v63':'hana-shell-v63' in sw and 'app.js?v=2.0.30' in sw,
            'index cache bust':'app.js?v=2.0.30' in html and 'style.css?v=2.0.30' in html,
          }
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'), name)
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('QA failed: '+', '.join(failed))
          PY
          git diff --check

      - name: Commit completed release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hana-release-run.yml .github/workflows/hana-release-temp.yml
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: smarter capture, meeting records and focus tools"
          git push origin HEAD:main
