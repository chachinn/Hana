name: Hana packing + Smart Sort production release

on:
  push:
    paths:
      - '.github/workflows/hana-packing-smart-sort.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply production patch
        run: python .github/scripts/hana_packing_smart_sort_patch.py

      - name: Run release QA
        run: python .github/scripts/hana_packing_smart_sort_qa.py

      - name: Commit completed release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hana-packing-smart-sort.yml .github/scripts/hana_packing_smart_sort_patch.py .github/scripts/hana_packing_smart_sort_qa.py
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: add trip-aware packing and smarter sorting"
          git push origin HEAD:main
