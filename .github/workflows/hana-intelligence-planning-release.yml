name: Hana planning intelligence release
on:
  push:
    paths:
      - .github/workflows/hana-intelligence-planning-release.yml
permissions:
  contents: write
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extend intelligence engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('intelligence.js'); t=p.read_text()
          anchor='  function ask(query){\n'
          if 'function taskPriorityScore(' not in t:
            block=r'''  function taskPriorityScore(task){
    if(!task||task.done)return -999; let score=0; const now=today(); const due=String(task.dueDate||task.date||'').slice(0,10);
    if(due){const delta=daysBetween(now,due); if(delta<0)score+=14+Math.min(10,Math.abs(delta)); else if(delta===0)score+=12; else if(delta<=2)score+=8; else if(delta<=7)score+=4;}
    const priority=norm(task.priority||task.energy||''); if(/high|urgent|critical/.test(priority))score+=7; if(/low/.test(priority))score-=2;
    if(task.project)score+=1; if(/wait|waiting|blocked/.test(norm(`${task.title||''} ${task.notes||''}`)))score-=3; return score;
  }
  function prioritySuggestions(limit=8){return (state?.tasks||[]).filter(t=>!t.done).map(t=>({task:t,score:taskPriorityScore(t)})).sort((a,b)=>b.score-a.score).slice(0,limit);}
  function estimateMinutes(task){const n=Number(task?.estimatedMinutes||task?.durationMinutes||task?.minutes||0);if(n>0)return Math.min(480,Math.max(5,n));const text=norm(`${task?.title||''} ${task?.notes||''}`);if(/quick|email|reply|call|confirm|book/.test(text))return 15;if(/clean|shop|grocery|pack|review/.test(text))return 30;if(/report|write|study|workout|meeting|prepare/.test(text))return 60;return 30;}
  function timePocketPlan(minutes=30){let left=Math.max(5,Math.min(240,Number(minutes)||30));const chosen=[];for(const x of prioritySuggestions(40)){const m=estimateMinutes(x.task);if(m<=left){chosen.push({...x,minutes:m});left-=m;}if(left<5)break;}return{minutes:Number(minutes)||30,used:(Number(minutes)||30)-left,left,items:chosen};}
  function dailyPlan(){const capacity=Math.max(60,Number(state?.settings?.dailyCapacityMinutes||240));const plan=timePocketPlan(capacity);const overdue=(state?.tasks||[]).filter(t=>!t.done&&t.dueDate&&String(t.dueDate).slice(0,10)<today()).length;const total=(state?.tasks||[]).filter(t=>!t.done).reduce((s,t)=>s+estimateMinutes(t),0);return{capacity,total,overloaded:total>capacity*1.35,overdue,...plan};}
  function dependencyCandidates(){const tasks=(state?.tasks||[]).filter(t=>!t.done);const out=[];tasks.forEach(t=>{const text=norm(`${t.title||''} ${t.notes||''}`);if(!/\b(after|before|once|when|depends|blocked by|waiting for)\b/.test(text))return;const tt=tokens(text);const matches=tasks.filter(o=>o.id!==t.id&&tokens(o.title).some(x=>tt.includes(x))).slice(0,3);if(matches.length)out.push({task:t,matches});});return out.slice(0,8);}
  function projectCandidates(){const tasks=(state?.tasks||[]).filter(t=>!t.done&&!t.project);const buckets={};tasks.forEach(t=>tokens(t.title).forEach(k=>{(buckets[k]||=[]).push(t)}));return Object.entries(buckets).filter(([k,v])=>k.length>3&&v.length>=3).sort((a,b)=>b[1].length-a[1].length).slice(0,6).map(([keyword,items])=>({keyword,items}));}
  function conversionProposal(query){const r=semanticSearch(query,5);if(!r.length)return{answer:'I could not find an item to convert.',source:null,options:[]};const source=r[0];const options=source.kind==='note'?['Checklist','Project','Tracker']:source.kind==='list'?['Project','Tracker','Note']:source.kind==='tracker'?['Tasks','Project','Note']:['Note','Checklist','Project'];return{answer:`I found “${source.title}” (${source.kind}). I can help turn it into ${options.join(', ')}. This is a proposal only; Hana will not replace the original automatically.`,source,options};}
  function learnPreference(key,value){const m=ensureMemory();const k=norm(key);if(!k)return false;m.learned[k]={value:String(value),updatedAt:Date.now()};const keys=Object.keys(m.learned);if(keys.length>300)keys.sort((a,b)=>(m.learned[a].updatedAt||0)-(m.learned[b].updatedAt||0)).slice(0,keys.length-300).forEach(x=>delete m.learned[x]);if(typeof saveState==='function')saveState();return true;}
  function recallPreference(key){return ensureMemory().learned[norm(key)]?.value||'';}
'''
            if anchor not in t: raise SystemExit('ask anchor missing')
            t=t.replace(anchor,block+anchor,1)
          old="    if(/weekly reset|review my week|what needs attention|what should i review/.test(q)){const r=weeklyReset();return {answer:`Weekly reset: ${r.overdue.length} overdue, ${r.upcoming.length} coming up this week, ${r.waiting.length} waiting items, ${r.duplicates.length} duplicate groups, and ${r.conflicts.length} calendar conflicts.`,review:r,results:[]};}\n"
          if 'time pocket' not in t[t.find('function ask(query)'):t.find('function navigateResult')]:
            extra=old+"    if(/time pocket|what can i do in|fit into/.test(q)){const m=Number(q.match(/(\\d{1,3})\\s*(min|minute)/)?.[1]||30),p=timePocketPlan(m);return {answer:p.items.length?`For about ${m} minutes, I’d suggest:\\n\\n${p.items.map(x=>`• ${x.task.title} — ~${x.minutes} min`).join('\\n')}`:`I couldn’t find an open task that fits about ${m} minutes.`,results:p.items.map(x=>corpus().find(e=>e.kind==='task'&&e.id===x.task.id)).filter(Boolean)};}\n    if(/plan my day|daily plan|what should i do today|prioriti/.test(q)){const p=dailyPlan();return {answer:`Today’s local plan uses about ${p.used} of ${p.capacity} available minutes.${p.overloaded?' Your open workload looks heavier than today’s capacity, so Rescue My Day may help.':''}\\n\\n${p.items.slice(0,8).map((x,i)=>`${i+1}. ${x.task.title} — ~${x.minutes} min`).join('\\n')}`,results:p.items.map(x=>corpus().find(e=>e.kind==='task'&&e.id===x.task.id)).filter(Boolean)};}\n    if(/rescue my day|overloaded|too much today/.test(q)){const p=dailyPlan();return {answer:p.overloaded?`Your open task load is roughly ${p.total} minutes against a ${p.capacity}-minute daily capacity. Hana suggests protecting the highest-priority ${p.items.length} items first and postponing, shrinking, or delegating lower-scored work.`:'Your current open workload does not look heavily above your configured daily capacity.',results:p.items.map(x=>corpus().find(e=>e.kind==='task'&&e.id===x.task.id)).filter(Boolean)};}\n    if(/dependenc|blocked by|what depends/.test(q)){const d=dependencyCandidates();return {answer:d.length?`I found ${d.length} possible dependency pattern${d.length===1?'':'s'}. Review them before linking anything.`:'I didn’t find obvious dependency wording in open tasks.',results:d.flatMap(x=>[x.task,...x.matches]).map(t=>corpus().find(e=>e.kind==='task'&&e.id===t.id)).filter(Boolean).slice(0,10)};}\n    if(/make.*project|project candidate|group.*project/.test(q)){const p=projectCandidates();return {answer:p.length?`I found ${p.length} possible task cluster${p.length===1?'':'s'} that may deserve a project. Strongest theme: “${p[0].keyword}” with ${p[0].items.length} tasks.`:'I didn’t find a strong unprojected task cluster yet.',results:p.flatMap(x=>x.items).map(t=>corpus().find(e=>e.kind==='task'&&e.id===t.id)).filter(Boolean).slice(0,10)};}\n    if(/convert|turn .* into|change .* to (checklist|project|tracker|note)/.test(q)){const c=conversionProposal(q.replace(/convert|turn|into|checklist|project|tracker|note|change|to/g,' '));return {answer:c.answer,results:c.source?[c.source]:[]};}\n"
            if old not in t: raise SystemExit('weekly ask anchor missing')
            t=t.replace(old,extra,1)
          oldexp="  window.HanaIntelligence={ask,search:semanticSearch,suggestions,weeklyReset,naturalDate,relationships:relationshipGroups,duplicates:duplicateGroups,conflicts,open:openIntelligence,status:()=>({localOnly:true,version:'v1',corpus:corpus().length,suggestionCount:suggestions().length})};"
          newexp="  window.HanaIntelligence={ask,search:semanticSearch,suggestions,weeklyReset,naturalDate,relationships:relationshipGroups,duplicates:duplicateGroups,conflicts,priority:prioritySuggestions,timePocket:timePocketPlan,dailyPlan,dependencies:dependencyCandidates,projectCandidates,conversionProposal,learn:learnPreference,recall:recallPreference,open:openIntelligence,status:()=>({localOnly:true,version:'v1',corpus:corpus().length,suggestionCount:suggestions().length,planning:true})};"
          if oldexp in t:t=t.replace(oldexp,newexp,1)
          p.write_text(t)
          p=Path('service-worker.js');t=p.read_text().replace('hana-shell-v1-intelligence-1','hana-shell-v1-intelligence-2');p.write_text(t)
          PY
      - name: Static checks
        run: |
          node --check intelligence.js
          node --check app.js
          node --check recovery-safety.js
          node --check service-worker.js
          grep -q 'hana-shell-v1-intelligence-2' service-worker.js
          grep -q 'function dailyPlan' intelligence.js
          grep -q 'function dependencyCandidates' intelligence.js
          grep -q 'function conversionProposal' intelligence.js
          grep -q 'const STORAGE_KEY = "hana_app_v1"' app.js
          git diff --check
      - name: Install browser driver
        run: npm install --prefix /tmp/hana-plan-pw --no-save --package-lock=false playwright-core
      - name: Start Hana
        run: |
          python3 -m http.server 4173 >/tmp/hana-plan.log 2>&1 &
          sleep 2
      - name: Planning intelligence QA
        env:
          NODE_PATH: /tmp/hana-plan-pw/node_modules
        run: |
          node <<'NODE'
          const {chromium}=require('playwright-core'),fs=require('fs');const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);(async()=>{const b=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});const c=await b.newContext({viewport:{width:430,height:932},isMobile:true,hasTouch:true,serviceWorkers:'block'});const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:4173/');await p.waitForTimeout(900);await p.evaluate(()=>{try{closeModal('accountWelcomeModal')}catch(_){}});const r=await p.evaluate(()=>{const sp=state.spaces[0]?.id||'personal';state.tasks=[{id:'a',title:'Submit visa application',notes:'after passport photo',space:sp,dueDate:todayISO(),done:false,estimatedMinutes:60,createdAt:Date.now(),updatedAt:Date.now()},{id:'b',title:'Get passport photo',space:sp,done:false,estimatedMinutes:15,createdAt:Date.now(),updatedAt:Date.now()},{id:'c',title:'Write Japan itinerary',space:sp,done:false,estimatedMinutes:30,createdAt:Date.now(),updatedAt:Date.now()},{id:'d',title:'Review Japan food list',space:sp,done:false,estimatedMinutes:20,createdAt:Date.now(),updatedAt:Date.now()},{id:'e',title:'Book Japan hotel',space:sp,done:false,estimatedMinutes:20,createdAt:Date.now(),updatedAt:Date.now()}];const pocket=HanaIntelligence.timePocket(45);const daily=HanaIntelligence.dailyPlan();const deps=HanaIntelligence.dependencies();const projects=HanaIntelligence.projectCandidates();const conv=HanaIntelligence.conversionProposal('Japan itinerary');HanaIntelligence.learn('preferred planning style','compact');return{pocket:pocket.items.length,daily:daily.items.length,deps:deps.length,projects:projects.length,conv:conv.options.length,remember:HanaIntelligence.recall('preferred planning style'),planning:HanaIntelligence.status().planning,storage:STORAGE_KEY,recovery:HanaRecoveryAudit.status().nonDestructiveAuthCleanup,ask:HanaIntelligence.ask('plan my day').answer};});if(!r.planning||r.pocket<1||r.daily<1||r.deps<1||r.projects<1||r.conv<1||r.remember!=='compact'||r.storage!=='hana_app_v1'||!r.recovery||!r.ask.includes('Today'))throw new Error(JSON.stringify(r));if(errs.length)throw new Error(errs.join('|'));console.log('Planning intelligence QA passed',JSON.stringify(r));await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit tested planner intelligence
        run: |
          git config user.name "Hana QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add intelligence.js service-worker.js
          git diff --check --cached
          if ! git diff --cached --quiet; then
            git commit -m "Complete Hana local planning intelligence"
            git push origin HEAD:main
          fi
