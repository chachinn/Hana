name: Hana planning intelligence release
on:
  push:
    paths:
      - .github/workflows/hana-intelligence-planning-release.yml
permissions:
  contents: write
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply planning intelligence
        run: python3 .github/scripts/extend_hana_intelligence.py
      - name: Static safety checks
        run: |
          node --check app.js
          node --check intelligence.js
          node --check recovery-safety.js
          node --check smart-templates.js
          node --check service-worker.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'const STORAGE_KEY = "hana_app_v1"' app.js
          grep -q 'hana-shell-v1-intelligence-2' service-worker.js
          grep -q 'function dailyPlan' intelligence.js
          grep -q 'function dependencyCandidates' intelligence.js
          grep -q 'function conversionProposal' intelligence.js
          git diff --check
      - name: Install browser driver
        run: npm install --prefix /tmp/hana-plan-pw --no-save --package-lock=false playwright-core
      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 >/tmp/hana-plan.log 2>&1 &
          sleep 2
      - name: iPhone planning intelligence QA
        env:
          NODE_PATH: /tmp/hana-plan-pw/node_modules
        run: node .github/scripts/hana_intelligence_planning_qa.js
      - name: Commit tested planning intelligence
        run: |
          git config user.name "Hana QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add intelligence.js service-worker.js
          git diff --check --cached
          if ! git diff --cached --quiet; then
            git commit -m "Complete Hana local planning intelligence"
            git push origin HEAD:main
          fi
