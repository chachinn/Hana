name: Hana template forms and focus cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    if: github.event.head_commit.message == 'Run Hana template and focus cleanup release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply template and focus cleanup
        run: python scripts/hana-template-form-cleanup-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Run focused QA
        run: python scripts/hana-template-form-cleanup-qa.py

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.23"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'hana-shell-v56' service-worker.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-template-form-cleanup.yml scripts/hana-template-form-cleanup-patch.py scripts/hana-template-form-cleanup-qa.py
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Clean up Hana templates and Focus Bouquet UI"
          git push origin HEAD:main
