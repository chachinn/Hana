name: Hana unreleased v1 baseline release

on:
  push:
    paths:
      - .github/workflows/hana-unreleased-v1-baseline-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset active release identity to unreleased Version 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text()
          replacements = [
            ('HANA 🌸 Version 1.1 · Smart Template Garden 1.1.0', 'HANA 🌸 Version 1 · unreleased baseline 1.0.0'),
            ('const HANA_APP_VERSION = "1.1.0";', 'const HANA_APP_VERSION = "1.0.0";'),
            ('const HANA_DISPLAY_VERSION = "1.1";', 'const HANA_DISPLAY_VERSION = "1";'),
          ]
          for old,new in replacements:
            if old not in text:
              raise SystemExit(f'Missing app marker: {old}')
            text = text.replace(old,new,1)

          release = '''const HANA_RELEASE_NOTES = {
            version: HANA_DISPLAY_VERSION,
            date: "August 15, 2026",
            title: "Welcome to Hana v1 🌸",
            intro: "This is Hana’s first complete release baseline. Everything built during pre-release development—including Smart Template Garden, Smart Packing, skincare planning, cloud backup and Hana’s planning tools—belongs to Version 1 from day one.",
            items: [
              { icon:"✨", title:"Smart Template Garden", text:"Browse the Smart Paste Guide, choose from more than 50 understood formats, or paste naturally into Brain Dump and let Smart Sort recognize useful structures while keeping examples as unsaved placeholders only." },
              { icon:"🧳", title:"Packing that learns with you", text:"Smart Packing uses 21 travel categories, editable category choices, custom categories and a local learning dictionary that remembers your corrections." },
              { icon:"🧴", title:"Weekly skincare planning", text:"Paste natural AM/PM routines, grouped weekdays and exceptions; Hana turns them into an editable weekly skincare planner with a time-aware Today shortcut." },
              { icon:"🌷", title:"Plan and organize in one garden", text:"Today, Tasks, Lists, Notes, Trackers, Calendar, Projects, Reminders, Templates, Brain Dump, Memory Threads and Hana’s focus tools work together without forcing one planning style." },
              { icon:"☁️", title:"Private first, cloud when you want it", text:"Hana stays local-first with autosave, safety snapshots, Trash and export. Optional Google or email sign-in adds cloud backup without making an account mandatory." },
              { icon:"🎀", title:"Made to be yours", text:"Customize themes, wallpaper, spaces, Quick Access, bottom navigation, categories, fields and practical defaults while keeping Hana mobile-first and iPhone-friendly." }
            ]
          };'''
          pattern = r'const HANA_RELEASE_NOTES = \{.*?\n\};\n\nlet hanaAccountState'
          if not re.search(pattern,text,flags=re.S):
            raise SystemExit('Release notes block not found')
          text = re.sub(pattern, lambda _m: release + '\n\nlet hanaAccountState', text, count=1, flags=re.S)
          app.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          swaps = [
            ('hana-app-version" content="1.1.0"','hana-app-version" content="1.0.0"'),
            ('style.css?v=1.1.0','style.css?v=1.0.0'),
            ('smart-templates.css?v=1.1.0','smart-templates.css?v=1.0.0'),
            ('<span>Version <span data-hana-version>1.1</span></span>','<span>Version <span data-hana-version>1</span></span>'),
            ('app.js?v=1.1.0','app.js?v=1.0.0'),
            ('smart-templates.js?v=1.1.0','smart-templates.js?v=1.0.0'),
          ]
          for old,new in swaps:
            if old not in text:
              raise SystemExit(f'Missing index marker: {old}')
            text = text.replace(old,new,1)
          index.write_text(text)

          style = Path('style.css')
          text = style.read_text()
          old = 'Version 1.1 — Smart Template Garden'
          if old not in text: raise SystemExit('Style version header missing')
          style.write_text(text.replace(old,'Version 1 — Smart Template Garden',1))

          smart_js = Path('smart-templates.js')
          text = smart_js.read_text()
          old = 'HANA 🌸 Smart Template Garden v1.1'
          if old not in text: raise SystemExit('Smart JS version header missing')
          smart_js.write_text(text.replace(old,'HANA 🌸 Smart Template Garden · Version 1',1))

          smart_css = Path('smart-templates.css')
          text = smart_css.read_text()
          old = '/* HANA 🌸 Smart Template Garden v1.1 */'
          if old not in text: raise SystemExit('Smart CSS version header missing')
          smart_css.write_text(text.replace(old,'/* HANA 🌸 Smart Template Garden · Version 1 */',1))

          sw = Path('service-worker.js')
          text = sw.read_text()
          swaps = [
            ('HANA 🌸 Service Worker v1.1 · Smart Template Garden','HANA 🌸 Service Worker v1 · Version 1 baseline'),
            ('const CACHE_NAME = "hana-shell-v1-1";','const CACHE_NAME = "hana-shell-v1";'),
            ('style.css?v=1.1.0','style.css?v=1.0.0'),
            ('smart-templates.css?v=1.1.0','smart-templates.css?v=1.0.0'),
            ('app.js?v=1.1.0','app.js?v=1.0.0'),
            ('smart-templates.js?v=1.1.0','smart-templates.js?v=1.0.0'),
          ]
          for old,new in swaps:
            if old not in text:
              raise SystemExit(f'Missing service worker marker: {old}')
            text = text.replace(old,new,1)
          sw.write_text(text)
          PY

      - name: Static QA
        run: |
          node --check app.js
          node --check smart-templates.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'Welcome to Hana v1' app.js
          grep -q 'hana-app-version" content="1.0.0"' index.html
          grep -q 'style.css?v=1.0.0' index.html
          grep -q 'smart-templates.css?v=1.0.0' index.html
          grep -q 'app.js?v=1.0.0' index.html
          grep -q 'smart-templates.js?v=1.0.0' index.html
          grep -q 'Version <span data-hana-version>1</span>' index.html
          grep -q 'const CACHE_NAME = "hana-shell-v1"' service-worker.js
          grep -q 'smart-templates.js?v=1.0.0' service-worker.js
          grep -q 'Smart Template Garden · Version 1' smart-templates.js
          grep -q 'Smart Template Garden · Version 1' smart-templates.css
          ! grep -q '1.1.0' app.js
          ! grep -q '1.1.0' index.html
          ! grep -q '1.1.0' service-worker.js
          git diff --check

      - name: Install browser driver
        run: npm install --prefix /tmp/hana-v1-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-v1-http.log 2>&1 &
          sleep 2

      - name: iPhone-sized Version 1 + Smart Template QA
        env:
          NODE_PATH: /tmp/hana-v1-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('No browser executable found');
          (async()=>{
            const browser = await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const context = await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage(), errors=[];
            page.on('pageerror',error=>errors.push(String(error.stack||error)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            await page.evaluate(()=>{try{closeModal('accountWelcomeModal')}catch(_){}});

            const identity = await page.evaluate(()=>({
              app:HANA_APP_VERSION,
              display:HANA_DISPLAY_VERSION,
              release:HANA_RELEASE_NOTES.version,
              title:HANA_RELEASE_NOTES.title,
              meta:document.querySelector('meta[name="hana-app-version"]')?.content||'',
              storage:STORAGE_KEY,
              backupDb:BACKUP_DB_NAME,
              backupMeta:BACKUP_META_KEY,
              catalog:window.HANA_SMART_TEMPLATE_CATALOG?.length||0,
              profiles:Object.keys(window.HANA_EXPANDED_SMART_PROFILES||{}).length
            }));
            if(identity.app!=='1.0.0'||identity.display!=='1'||identity.release!=='1'||identity.meta!=='1.0.0'||!identity.title.includes('Hana v1')) throw new Error('Version 1 identity failed '+JSON.stringify(identity));
            if(identity.storage!=='hana_app_v1'||identity.backupDb!=='hana_safety_backups_v1'||identity.backupMeta!=='hana_backup_meta_v1') throw new Error('Persistent storage identity changed '+JSON.stringify(identity));
            if(identity.catalog<45||identity.profiles<20) throw new Error('Smart Template Garden missing '+JSON.stringify(identity));

            const menuVersion = await page.locator('[data-hana-version]').first().innerText();
            if(menuVersion.trim()!=='1') throw new Error('Visible menu version is not Version 1: '+menuVersion);

            const detected=await page.evaluate(()=>({
              wedding:smartStructuredCaptureKind('Wedding Planner\nVenue:\nBook venue'),
              hair:smartStructuredCaptureKind('Haircare Schedule\nMonday:\nShampoo | Test'),
              trip:smartStructuredCaptureKind('Trip Prep\nDocuments:\nPassport'),
              bills:smartStructuredCaptureKind('Bills Schedule\nInternet | 1000 | 2026-08-25'),
              packing:smartStructuredCaptureKind('Travel packing\nTop\nShoes\nPassport\nCharger'),
              skincare:skincareTextLooksStructured('Morning Routine\nDaily\nCleanser → Sample\nToner → Sample\nMoisturizer → Sample\nSunscreen → Sample',{allowSingleDay:false})
            }));
            const expected={wedding:'wedding-planner',hair:'haircare',trip:'trip-prep',bills:'bills-schedule',packing:'packing'};
            for(const [key,value] of Object.entries(expected)) if(detected[key]!==value) throw new Error(`Detection ${key} -> ${detected[key]} expected ${value}`);
            if(!detected.skincare) throw new Error('Existing skincare recognition regressed');

            await page.evaluate(()=>openSmartTemplateTutorial());
            await page.waitForTimeout(80);
            const guide=await page.evaluate(()=>({visible:!document.getElementById('smartTemplateTutorialModal')?.classList.contains('hidden'),cards:document.querySelectorAll('[data-smart-paste-card]').length,exampleValues:[...document.querySelectorAll('#smartTemplateTutorialModal input, #smartTemplateTutorialModal textarea')].map(el=>el.value).filter(Boolean)}));
            if(!guide.visible||guide.cards<45||guide.exampleValues.length) throw new Error('Smart Paste Guide safety failed '+JSON.stringify(guide));

            await page.click('[data-use-smart-template-kind="wedding-planner"]');
            await page.waitForTimeout(160);
            const brain=await page.evaluate(()=>({page:state.currentPage,destination:document.getElementById('brainDumpDestination')?.value,value:document.getElementById('brainDumpText')?.value,placeholder:document.getElementById('brainDumpText')?.placeholder||''}));
            if(brain.page!=='inbox'||brain.destination!=='wedding-planner'||brain.value!==''||!brain.placeholder.includes('Wedding Planner')) throw new Error('Guide handoff failed '+JSON.stringify(brain));

            const persistence=await page.evaluate(()=>{
              state.tasks.push(normalizeTask({id:'v1-persistence-check',title:'Version 1 persistence check',space:'personal',createdAt:Date.now(),updatedAt:Date.now()}));
              saveState({snapshot:false});
              return localStorage.getItem(STORAGE_KEY)?.includes('Version 1 persistence check')||false;
            });
            if(!persistence) throw new Error('Version 1 state did not persist to existing storage key');
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForTimeout(700);
            const survived=await page.evaluate(()=>state.tasks.some(task=>task.id==='v1-persistence-check'&&task.title==='Version 1 persistence check'));
            if(!survived) throw new Error('Saved state did not survive reload');

            const pages=[['tasks','Tasks'],['lists','Lists'],['calendar','Calendar'],['notes','Notes'],['tables','Trackers'],['projects','Projects'],['inbox','Brain Dump'],['templates','Templates'],['settings','Settings']];
            for(const [name,marker] of pages){await page.evaluate(p=>changePage(p),name);await page.waitForTimeout(60);const text=await page.locator('#pageContent').innerText();if(!text.includes(marker))throw new Error(`${name} failed to render`);}
            if(errors.length) throw new Error('Browser runtime errors: '+errors.join(' | '));
            await browser.close();
            console.log('Hana unreleased Version 1 QA passed',JSON.stringify({identity,detected,guide}));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Commit Version 1 baseline correction
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html style.css smart-templates.js smart-templates.css service-worker.js
          git diff --check --cached
          git commit -m "Hana: keep unreleased Smart Template Garden in Version 1"
          git push origin main
