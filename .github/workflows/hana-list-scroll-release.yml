name: Hana list column scroll release
on:
  push:
    branches:
      - fix/list-column-scroll-position
    paths:
      - .github/workflows/hana-list-scroll-release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/list-column-scroll-position
          fetch-depth: 0
      - name: Wire list scroll preservation into Hana
        run: python3 .github/scripts/hana_list_scroll_wire.py
      - name: Static safety checks
        run: |
          node --check app.js
          node --check list-scroll-memory.js
          node --check skincare-step-sync.js
          node --check recovery-safety.js
          node --check service-worker.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'const STORAGE_KEY = "hana_app_v1"' app.js
          grep -q 'list-scroll-memory.js?v=1.0.0' index.html
          grep -q 'const CACHE_NAME = "hana-shell-v1-list-column-scroll-1"' service-worker.js
          grep -q 'list-scroll-memory.js?v=1.0.0' service-worker.js
          grep -q 'Lists stay where you’re working' list-scroll-memory.js
          grep -q 'baseToggleListItem' list-scroll-memory.js
          git diff --check
      - name: Install browser driver
        run: npm install --prefix /tmp/hana-list-pw --no-save --package-lock=false playwright-core
      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 >/tmp/hana-list.log 2>&1 &
          sleep 2
      - name: iPhone list column scroll QA
        env:
          NODE_PATH: /tmp/hana-list-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const fs=require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath)throw new Error('No browser executable found');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,serviceWorkers:'block',userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e.stack||e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1000);
            await page.evaluate(()=>{try{closeModal('accountWelcomeModal')}catch(_){};try{closeModal('tutorialModal')}catch(_){};try{closeModal('whatsNewModal')}catch(_){}});

            const result=await page.evaluate(async()=>{
              const list={
                id:'qa-four-column-list',name:'QA Grocery',icon:'☑️',space:'personal',columnMode:true,columnCount:4,
                columnLabels:{partner:'Cha',me:'Martin',both:'Both',column4:'Supermart',column5:'Column 5'},
                resettable:true,templateType:'',tripStartAt:'',createdAt:Date.now(),updatedAt:Date.now(),
                items:[
                  {id:'qa-c1',title:'Column one item',lane:'partner',completed:false,quantity:'',detail:'',createdAt:Date.now(),updatedAt:Date.now()},
                  {id:'qa-c2',title:'Column two item',lane:'me',completed:false,quantity:'',detail:'',createdAt:Date.now(),updatedAt:Date.now()},
                  {id:'qa-c3',title:'Column three item',lane:'both',completed:false,quantity:'',detail:'',createdAt:Date.now(),updatedAt:Date.now()},
                  {id:'qa-c4',title:'Wet wipes',lane:'column4',completed:false,quantity:'',detail:'',createdAt:Date.now(),updatedAt:Date.now()},
                  {id:'qa-c4b',title:'Yakisoba',lane:'column4',completed:false,quantity:'',detail:'',createdAt:Date.now(),updatedAt:Date.now()}
                ]
              };
              state.currentPage='lists';state.activeListId=list.id;state.lists=[list];render();
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
              let board=document.querySelector('.list-column-board');
              if(!board)throw new Error('Column board did not render');
              const maxBefore=Math.max(0,board.scrollWidth-board.clientWidth);
              board.scrollLeft=maxBefore;
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
              const before=board.scrollLeft;
              const fourth=board.querySelector('.list-lane-column[data-list-lane="column4"] [data-toggle-list-item="qa-c4"]');
              if(!fourth)throw new Error('Fourth-column checkbox missing');
              fourth.click();
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(r))));
              board=document.querySelector('.list-column-board');
              const afterCheck=board?.scrollLeft||0;
              const completed=state.lists[0].items.find(item=>item.id==='qa-c4')?.completed===true;
              const completedToggle=document.querySelector('.completed-list-items [data-toggle-list-item="qa-c4"]');
              if(!completedToggle)throw new Error('Checked item did not move to Completed');
              completedToggle.click();
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(r))));
              board=document.querySelector('.list-column-board');
              const afterUncheck=board?.scrollLeft||0;
              const pendingAgain=state.lists[0].items.find(item=>item.id==='qa-c4')?.completed===false;
              const backInFourth=Boolean(board?.querySelector('.list-lane-column[data-list-lane="column4"] [data-toggle-list-item="qa-c4"]'));
              return{
                app:HANA_APP_VERSION,display:HANA_DISPLAY_VERSION,storage:STORAGE_KEY,
                feature:window.HanaListScrollMemory?.featureKey||'',
                releaseItem:HANA_RELEASE_NOTES.items.some(item=>item.title==='Lists stay where you’re working'),
                before,afterCheck,afterUncheck,maxBefore,completed,pendingAgain,backInFourth,
                tagged:board?.dataset.hanaListScrollId||'',
                noPageX:document.documentElement.scrollWidth<=innerWidth+2,
                recovery:HanaRecoveryAudit?.status?.().nonDestructiveAuthCleanup===true,
                weekend:[...document.getElementById('reminderRepeat').options].some(o=>o.value==='weekends'),
                skincare:Boolean(window.HanaSkincareStepSync)
              };
            });

            if(result.app!=='1.0.0'||result.display!=='1'||result.storage!=='hana_app_v1')throw new Error('Version/storage identity changed '+JSON.stringify(result));
            if(result.feature!=='hana-v1-2026-08-16-list-column-scroll'||!result.releaseItem)throw new Error('List scroll feature/What’s New missing '+JSON.stringify(result));
            if(result.maxBefore<80||result.before<60)throw new Error('QA list did not create meaningful horizontal scroll '+JSON.stringify(result));
            if(Math.abs(result.afterCheck-result.before)>3)throw new Error('Checking fourth-column item reset horizontal scroll '+JSON.stringify(result));
            if(Math.abs(result.afterUncheck-result.before)>3)throw new Error('Unchecking completed item reset horizontal scroll '+JSON.stringify(result));
            if(!result.completed||!result.pendingAgain||!result.backInFourth)throw new Error('List item completion behavior regressed '+JSON.stringify(result));
            if(result.tagged!=='qa-four-column-list')throw new Error('Rendered board was not tagged to its list '+JSON.stringify(result));
            if(!result.noPageX||!result.recovery||!result.weekend||!result.skincare)throw new Error('Retention/mobile safety regression '+JSON.stringify(result));
            if(errors.length)throw new Error('Browser runtime errors: '+errors.join(' | '));
            console.log('Hana list column scroll QA passed',JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit tested runtime wiring
        run: |
          git config user.name "Hana QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --check --cached
          git diff --cached --quiet && { echo 'No runtime wiring changes to commit'; exit 1; }
          git commit -m "Hana: preserve list column scroll on check"
          git push origin HEAD:fix/list-column-scroll-position
