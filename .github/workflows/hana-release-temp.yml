          replace_once(
              'app.js',
              '  if(event.target.closest("[data-add-meeting-agenda-item]")){addMeetingAgendaItem();return;}\n  const removeMeetingAgenda=event.target.closest("[data-remove-meeting-agenda-item]");if(removeMeetingAgenda){removeMeetingAgendaItem(removeMeetingAgenda);return;}',
