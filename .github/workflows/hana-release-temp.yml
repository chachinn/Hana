  {value:"someday",label:"🌱 Someday"}
];
function brainDumpDestinationOptions(selected="auto"){const value=BRAIN_DUMP_DESTINATIONS.some(item=>item.value===selected)?selected:"auto";return BRAIN_DUMP_DESTINATIONS.map(item=>`<option value="${item.value}" ${item.value===value?"selected":""}>${item.label}</option>`).join("");}
function brainDumpDestinationLabel(destination,text){if(!destination||destination==="auto")return predictCapture(text).label;return BRAIN_DUMP_DESTINATIONS.find(item=>item.value===destination)?.label||predictCapture(text).label;}

function updateCapturePrediction'''
          regex_once('app.js', r'function predictCapture\(text\)\{.*?\}\n\nfunction updateCapturePrediction', smarter_predict, 'smarter capture prediction')

          replace_once(
              'app.js',
              'function plantText(text,space=preferredSpace()){\n  const pred=predictCapture(text),meta=parseCaptureMeta(text,space);',
              'function plantText(text,space=preferredSpace(),forcedType="auto"){\n  const suggested=predictCapture(text),forced=BRAIN_DUMP_DESTINATIONS.some(item=>item.value===forcedType)&&forcedType!=="auto"?forcedType:"";\n  const pred=forced?{type:forced,label:brainDumpDestinationLabel(forced,text)}:suggested,meta=parseCaptureMeta(text,space);',
