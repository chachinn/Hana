          replace_once('app.js', '<summary><span>🧩 Start from a note template</span><small>Meetings · Weekly skincare · Bionote · Strategy · Measurements</small></summary>', '<summary><span>🧩 Start from a note template</span><small>Meetings · Weekly skincare · Strategy · Measurements</small></summary>', 'remove bionote chip summary')
