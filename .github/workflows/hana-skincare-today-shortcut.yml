name: Hana skincare Today shortcut release

on:
  push:
    paths:
      - '.github/workflows/hana-skincare-today-shortcut.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply release patch
        run: python .github/scripts/hana_skincare_today_patch.py
      - name: Run release QA
        run: python .github/scripts/hana_skincare_today_qa.py
      - name: Commit completed release
        run: git config user.name "Hana Release Bot" && git config user.email "actions@users.noreply.github.com" && git rm .github/workflows/hana-skincare-today-shortcut.yml .github/scripts/hana_skincare_today_patch.py .github/scripts/hana_skincare_today_qa.py && git add app.js index.html style.css service-worker.js && git commit -m "Hana: add time-aware skincare shortcut" && git push origin HEAD:main
