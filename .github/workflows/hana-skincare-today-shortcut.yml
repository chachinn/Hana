name: Hana skincare Today shortcut release

on:
  push:
    paths:
      - '.github/workflows/hana-skincare-today-shortcut.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair patch target and apply release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/hana_skincare_today_patch.py')
          text=p.read_text(encoding='utf-8')
          old='app = replace_once(app, "  renderQuickAccess();", "  renderQuickAccess();\\n  refreshSkincareQuickButton();", "render shortcut refresh")'
          new='''render_pos = app.index("function render() {")
          quick_target = "  renderQuickAccess();"
          quick_pos = app.index(quick_target, render_pos)
          app = app[:quick_pos] + "  renderQuickAccess();\\n  refreshSkincareQuickButton();" + app[quick_pos + len(quick_target):]'''
          if old not in text:
              raise SystemExit('Could not find renderQuickAccess patch line')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python .github/scripts/hana_skincare_today_patch.py
      - name: Run release QA
        run: python .github/scripts/hana_skincare_today_qa.py
      - name: Commit completed release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hana-skincare-today-shortcut.yml .github/scripts/hana_skincare_today_qa.py
          git rm -f .github/scripts/hana_skincare_today_patch.py
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: add time-aware skincare shortcut"
          git push origin HEAD:main
