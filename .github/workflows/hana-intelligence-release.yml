name: Hana intelligence release QA
on:
  push:
    paths:
      - .github/workflows/hana-intelligence-release.yml
permissions:
  contents: write
jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire intelligence into Hana shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); t=p.read_text()
          css='  <link rel="stylesheet" href="intelligence.css?v=1.0.0" />\n'
          if 'intelligence.css?v=1.0.0' not in t:
              anchor='  <link rel="stylesheet" href="smart-templates.css?v=1.0.0" />\n'
              if anchor not in t: raise SystemExit('CSS anchor missing')
              t=t.replace(anchor,anchor+css,1)
          script='  <script src="intelligence.js?v=1.0.0"></script>\n'
          if 'intelligence.js?v=1.0.0' not in t:
              anchor='  <script src="recovery-safety.js?v=1.0.0-data-safe-1"></script>\n'
              if anchor in t: t=t.replace(anchor,anchor+script,1)
              else:
                  anchor='</body>'
                  if anchor not in t: raise SystemExit('script anchor missing')
                  t=t.replace(anchor,script+anchor,1)
          p.write_text(t)
          p=Path('service-worker.js'); t=p.read_text()
          t=t.replace('const CACHE_NAME = "hana-shell-v1-data-safe-3";','const CACHE_NAME = "hana-shell-v1-intelligence-1";',1)
          if '"./intelligence.css?v=1.0.0"' not in t:
              t=t.replace('  "./smart-templates.css?v=1.0.0",','  "./smart-templates.css?v=1.0.0",\n  "./intelligence.css?v=1.0.0",',1)
          if '"./intelligence.js?v=1.0.0"' not in t:
              t=t.replace('  "./smart-templates.js?v=1.0.0"','  "./smart-templates.js?v=1.0.0",\n  "./intelligence.js?v=1.0.0"',1)
          p.write_text(t)
          PY
      - name: Static safety checks
        run: |
          node --check app.js
          node --check intelligence.js
          node --check recovery-safety.js
          node --check smart-templates.js
          node --check service-worker.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'const STORAGE_KEY = "hana_app_v1"' app.js
          grep -q 'hana-shell-v1-intelligence-1' service-worker.js
          grep -q 'intelligence.js?v=1.0.0' index.html
          grep -q 'intelligence.css?v=1.0.0' index.html
          git diff --check
      - name: Install browser driver
        run: npm install --prefix /tmp/hana-ai-pw --no-save --package-lock=false playwright-core
      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 >/tmp/hana-ai-http.log 2>&1 &
          sleep 2
      - name: iPhone local intelligence QA
        env:
          NODE_PATH: /tmp/hana-ai-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core'); const fs=require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync); if(!executablePath)throw new Error('No browser');
          (async()=>{const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']}); const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,serviceWorkers:'block'}); const page=await context.newPage(); const errors=[];page.on('pageerror',e=>errors.push(String(e.stack||e))); await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1000);await page.evaluate(()=>{try{closeModal('accountWelcomeModal')}catch(_){}});
          const result=await page.evaluate(async()=>{state.tasks=[];state.notes=[];state.lists=[];state.projects=[];state.events=[];state.reminders=[]; const sp=state.spaces[0]?.id||'personal'; state.projects.push({id:'p1',name:'Japan Trip',space:sp,createdAt:Date.now(),updatedAt:Date.now()}); state.tasks.push({id:'t1',title:'Renew passport tomorrow',space:sp,project:'Japan Trip',done:false,createdAt:Date.now(),updatedAt:Date.now()},{id:'t2',title:'Buy adapter',space:sp,project:'Japan Trip',done:false,createdAt:Date.now(),updatedAt:Date.now()},{id:'t3',title:'Buy adapter',space:sp,done:false,createdAt:Date.now(),updatedAt:Date.now()}); state.notes.push({id:'n1',title:'Japan hotel booking',content:'Takadanobaba hotel reservation',space:sp,createdAt:Date.now(),updatedAt:Date.now()}); const a=HanaIntelligence.ask('What do I still need to do for Japan?'); const d=HanaIntelligence.duplicates(); const date=HanaIntelligence.naturalDate('renew passport tomorrow'); const rel=HanaIntelligence.relationships(); const sug=HanaIntelligence.suggestions(); HanaIntelligence.open(); await new Promise(r=>setTimeout(r,60)); return {status:HanaIntelligence.status(),answer:a.answer,dups:d.length,date:date?.date,rel:rel.length,suggestions:sug.length,modal:!document.getElementById('hanaIntelligenceModal').classList.contains('hidden'),button:!!document.getElementById('askHanaButton'),recovery:window.HanaRecoveryAudit?.status?.(),storage:STORAGE_KEY,app:HANA_APP_VERSION,display:HANA_DISPLAY_VERSION};});
          if(result.app!=='1.0.0'||result.display!=='1'||result.storage!=='hana_app_v1')throw new Error('Identity/storage changed '+JSON.stringify(result)); if(!result.recovery?.nonDestructiveAuthCleanup)throw new Error('Recovery guard missing'); if(!result.status.localOnly||!result.modal||!result.button||result.dups<1||!result.date||result.rel<1||result.suggestions<1||!result.answer.includes('Renew passport'))throw new Error('Intelligence QA failed '+JSON.stringify(result)); if(errors.length)throw new Error(errors.join(' | ')); console.log('Hana intelligence QA passed',JSON.stringify(result));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit tested shell wiring
        run: |
          git config user.name "Hana QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --check --cached
          if ! git diff --cached --quiet; then
            git commit -m "Wire local Hana intelligence into Version 1"
            git push origin HEAD:main
          fi
