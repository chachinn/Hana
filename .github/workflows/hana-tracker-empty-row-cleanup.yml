name: Hana tracker empty-row cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    if: github.event.head_commit.message == 'Run Hana tracker empty-row cleanup release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply update
        run: python scripts/hana-tracker-empty-row-cleanup-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Run QA
        run: python scripts/hana-tracker-empty-row-cleanup-qa.py

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.29"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'hana-shell-v62' service-worker.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-tracker-empty-row-cleanup.yml scripts/hana-tracker-empty-row-cleanup-patch.py scripts/hana-tracker-empty-row-cleanup-qa.py
          git add app.js index.html service-worker.js
          git diff --cached --check
          git commit -m "Add tracker multi-delete and empty-row cleanup"
          git push origin HEAD:main
