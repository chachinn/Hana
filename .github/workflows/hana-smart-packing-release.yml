name: Hana smart packing release

on:
  push:
    paths:
      - .github/workflows/hana-smart-packing-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply production patch
        run: python3 .github/scripts/hana_smart_packing_patch.py

      - name: Syntax and consistency
        run: |
          node --check app.js
          grep -q '2.0.40' app.js
          grep -q '2.0.40' index.html
          grep -q 'hana-shell-v73' service-worker.js
          grep -q 'smartPackingCategory' app.js
          grep -q 'smart-sort-brain-dump' index.html
          git diff --check

      - name: Install browser driver
        run: npm install --prefix /tmp/hana-pack-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-pack-http.log 2>&1 &
          sleep 2

      - name: iPhone runtime and smart packing QA
        env:
          NODE_PATH: /tmp/hana-pack-pw/node_modules
        run: node .github/scripts/hana_smart_packing_qa.js

      - name: Commit production files
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: add smart categorized packing lists"
          git push origin main
