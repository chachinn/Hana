name: Hana smart packing release

on:
  push:
    paths:
      - .github/workflows/hana-smart-packing-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply production patch
        run: python3 .github/scripts/hana_smart_packing_patch.py

      - name: Syntax and consistency
        run: |
          node --check app.js
          grep -q '2.0.40' app.js
          grep -q '2.0.40' index.html
          grep -q 'hana-shell-v73' service-worker.js
          grep -q 'smartPackingCategory' app.js
          grep -q 'smart-sort-brain-dump' index.html
          git diff --check

      - name: Install browser driver
        run: npm install --prefix /tmp/hana-pack-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-pack-http.log 2>&1 &
          sleep 2

      - name: iPhone runtime and smart packing QA
        env:
          NODE_PATH: /tmp/hana-pack-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('No browser executable found');
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox']});
            const context = await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            let text=await page.locator('#pageContent').innerText();
            if(!/Focus Bouquet|Nothing urgent|active/i.test(text))throw new Error('Today failed to render');

            const result=await page.evaluate(()=>{
              const sample=`Cha packing 2.0

Top
Bottoms
Dress
Underwear
Bra
Safety Shorts
pajamas
Shoes
Slippers
Socks
Accessories
Jacket
Hankerchief
Skincare (separate note)
Shampoo
Conditioner
Medicine
Panty Liner
Napkin
Hair Straightener
Deo
Fem Wash
Listerine
Toothbrush
Toothpaste
Toothpick
Soap
Lip Balm
Cotton
Makeup
Hair Clip
Deodorant
Perfume
Dear Face
Rose Vitamins
Glasses
Airpods
Adapter
Charger
Wet wipes
Powerbank
Sunscreen Beach
Hair Oil
Hair Matomake
Hair Brush
Air pump
Heat Protectant
Pimple Patch`;
              state.lists=[];state.threads=[];state.notes=[];state.activeListId='';state.activeThreadId='';
              const now=Date.now();
              state.notes.push(normalizeNote({id:'qa-skincare',title:'Weekly Skincare',type:'note',space:'personal',tags:['skincare','routine'],content:'',checklist:[],resettable:false,pinned:true,structuredType:'skincare-weekly',skincareRoutine:{focus:'',dayLabels:{},steps:[]},createdAt:now,updatedAt:now}));
              const kind=smartStructuredCaptureKind(sample);
              const created=createSmartStructuredCapture(sample,'personal',kind,{quiet:true,open:false});
              const list=state.lists[0];
              const byTitle=title=>list?.items.find(item=>item.title===title);
              const thread=state.threads[0];
              return {
                kind,created,name:list?.name,itemCount:list?.items.length,detailLabel:list?.detailLabel,
                deodorantCount:list?.items.filter(item=>item.title==='Deodorant').length,
                hasSkincareItem:list?.items.some(item=>/skincare/i.test(item.title)),
                topCategory:byTitle('Top')?.detail,
                hairCategory:byTitle('Hair Straightener')?.detail,
                feminineCategory:byTitle('Panty Liner')?.detail,
                techCategory:byTitle('Power Bank')?.detail,
                supplementCategory:byTitle('Rose Vitamins')?.detail,
                beautyCategory:byTitle('Makeup')?.detail,
                threadLinks:thread?.links?.map(link=>`${link.type}:${link.id}`)||[],
                threadCount:state.threads.length,
                noteCount:state.notes.length
              };
            });
            if(result.kind!=='packing'||result.created!=='packing')throw new Error('Cha packing heading was not recognized as packing');
            if(result.name!=='Cha packing 2.0')throw new Error('Reusable packing title was not preserved: '+result.name);
            if(result.itemCount!==46)throw new Error('Expected 46 categorized checklist items after separate-note extraction and deodorant dedupe, got '+result.itemCount);
            if(result.detailLabel!=='Category')throw new Error('Packing list is not category-aware');
            if(result.deodorantCount!==1)throw new Error('Deo/Deodorant alias was not deduplicated');
            if(result.hasSkincareItem)throw new Error('Separate skincare note leaked into checklist');
            if(result.topCategory!=='👗 Clothes')throw new Error('Top category wrong');
            if(result.hairCategory!=='💇 Hair')throw new Error('Hair category wrong');
            if(result.feminineCategory!=='🌸 Feminine care')throw new Error('Feminine category wrong');
            if(result.techCategory!=='🔌 Tech & travel gear')throw new Error('Tech category wrong');
            if(result.supplementCategory!=='💊 Medicine & supplements')throw new Error('Supplement category wrong');
            if(result.beautyCategory!=='💄 Beauty & skincare')throw new Error('Beauty category wrong');
            if(result.threadCount!==1||!result.threadLinks.includes('list:'+await page.evaluate(()=>state.lists[0].id))||!result.threadLinks.includes('note:qa-skincare'))throw new Error('Separate skincare note was not linked to packing list');
            if(result.noteCount!==1)throw new Error('Existing skincare note should be reused, not duplicated');

            await page.evaluate(()=>changePage('lists'));
            await page.waitForTimeout(100);
            text=await page.locator('#pageContent').innerText();
            for(const label of ['👗 Clothes','💇 Hair','🌸 Feminine care','🔌 Tech & travel gear','💊 Medicine & supplements']){
              if(!text.includes(label))throw new Error('Grouped packing UI missing '+label);
            }
            if(!text.includes('Cha packing 2.0'))throw new Error('Packing list failed to render');

            await page.evaluate(()=>{openSmartTemplate();});
            await page.waitForTimeout(50);
            const smartSortButton=page.locator('[data-smart-template-target="smart-sort-brain-dump"]');
            if(await smartSortButton.count()!==1)throw new Error('Smart Template Brain Dump route missing');
            await smartSortButton.click();
            await page.waitForTimeout(80);
            if(!await page.locator('#brainDumpText').isVisible())throw new Error('Smart Template did not route to Brain Dump');

            if(errors.length)throw new Error('Browser runtime errors: '+errors.join(' | '));
            console.log('Smart packing behavioral QA passed',JSON.stringify(result));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Commit production files
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js
          git commit -m "Hana: add smart categorized packing lists"
          git push origin main
