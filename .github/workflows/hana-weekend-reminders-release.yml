name: Hana weekend reminders release
on:
  push:
    paths:
      - .github/workflows/hana-weekend-reminders-release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply weekend reminder patch
        run: python3 .github/scripts/hana_weekend_reminders_patch.py
      - name: Static safety checks
        run: |
          node --check app.js
          node --check service-worker.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'const STORAGE_KEY = "hana_app_v1"' app.js
          grep -q 'const HANA_WHATS_NEW_KEY = "hana-v1-2026-08-16-weekend-reminders"' app.js
          grep -q 'title:"Weekend reminders"' app.js
          grep -q 'function nextWeekendISO' app.js
          grep -q 'option value="weekends">Weekends</option>' index.html
          grep -q 'const CACHE_NAME = "hana-shell-v1-weekend-reminders-1"' service-worker.js
          grep -q 'weekendReminder' .github/workflows/hana-runtime-smoke.yml
          git diff --check
      - name: Install browser driver
        run: npm install --prefix /tmp/hana-weekend-pw --no-save --package-lock=false playwright-core
      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 >/tmp/hana-weekend-http.log 2>&1 &
          sleep 2
      - name: Weekend recurrence and existing-feature browser QA
        env:
          NODE_PATH: /tmp/hana-weekend-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const fs=require('fs');
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath)throw new Error('No browser executable found');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,serviceWorkers:'block',userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e.stack||e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);
            await page.evaluate(()=>{try{closeModal('accountWelcomeModal')}catch(_){};try{closeModal('tutorialModal')}catch(_){};try{closeModal('whatsNewModal')}catch(_){}});

            const result=await page.evaluate(()=>{
              const option=[...document.getElementById('reminderRepeat').options].find(item=>item.value==='weekends');
              const helper={
                monday:nextWeekendISO('2026-08-17',true),
                saturdayKeep:nextWeekendISO('2026-08-22',true),
                saturdayNext:nextWeekendISO('2026-08-22',false),
                sundayNext:nextWeekendISO('2026-08-23',false)
              };
              const normalized=normalizeReminder({id:'qa-weekend-normalized',title:'Weekend normalized',date:'2026-08-22',repeatType:'weekends'});
              const repeat=normalizeReminder({id:'qa-weekend-repeat',title:'Weekend repeat',date:'2026-08-22',repeatType:'weekends'});
              advanceReminder(repeat);const afterSaturday=repeat.date;advanceReminder(repeat);const afterSunday=repeat.date;

              state.reminders=state.reminders.filter(r=>r.id!=='qa-weekend-save');
              const saved=normalizeReminder({id:'qa-weekend-save',title:'Weekend save',space:preferredSpace(),date:nextWeekendISO('2026-08-17',true),time:'09:00',repeatType:'weekends'});
              state.reminders.push(saved);
              const card=reminderCard(saved);

              return{
                option:option?.textContent||'', helper, normalized:normalized.repeatType,
                afterSaturday, afterSunday, cardHasWeekend:/weekends/.test(card),
                app:HANA_APP_VERSION,display:HANA_DISPLAY_VERSION,storage:STORAGE_KEY,
                whatsNewKey:HANA_WHATS_NEW_KEY,whatsNew:HANA_RELEASE_NOTES.items.some(item=>item.title==='Weekend reminders'),
                retained:{pomodoro:typeof pomodoroCardHTML==='function',skincare:typeof parseSkincareRoutineText==='function',packing:SMART_PACKING_CATEGORY_ORDER.length===21,mixed:typeof smartMixedDocumentPlan==='function',cloud:CLOUD_AUTO_BACKUP_HOUR===8}
              };
            });

            if(result.option!=='Weekends')throw new Error('Weekend option missing '+JSON.stringify(result));
            if(result.helper.monday!=='2026-08-22'||result.helper.saturdayKeep!=='2026-08-22'||result.helper.saturdayNext!=='2026-08-23'||result.helper.sundayNext!=='2026-08-29')throw new Error('Weekend date helper failed '+JSON.stringify(result));
            if(result.normalized!=='weekends'||result.afterSaturday!=='2026-08-23'||result.afterSunday!=='2026-08-29'||!result.cardHasWeekend)throw new Error('Weekend recurrence failed '+JSON.stringify(result));
            if(result.app!=='1.0.0'||result.display!=='1'||result.storage!=='hana_app_v1'||result.whatsNewKey!=='hana-v1-2026-08-16-weekend-reminders'||!result.whatsNew)throw new Error('Version/What’s New regression '+JSON.stringify(result));
            if(Object.values(result.retained).some(v=>v!==true))throw new Error('Existing feature retention failed '+JSON.stringify(result));
            if(errors.length)throw new Error('Runtime errors '+errors.join(' | '));
            console.log('Weekend reminder QA passed',JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit tested weekend reminder update
        run: |
          git config user.name "Hana QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html service-worker.js .github/workflows/hana-runtime-smoke.yml
          git diff --check --cached
          git diff --cached --quiet && { echo 'No runtime changes to commit'; exit 1; }
          git commit -m "Hana: add weekend-only reminder repeats"
          git push origin HEAD:main
