name: Hana Smart and Blank Templates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    if: github.event.head_commit.message == 'Run Hana Smart and Blank Template release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Smart and Blank Template update
        run: python scripts/hana-smart-blank-templates-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Run Smart and Blank Template QA
        run: python scripts/hana-smart-blank-templates-qa.py

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.26"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'hana-shell-v59' service-worker.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-smart-blank-templates.yml scripts/hana-smart-blank-templates-patch.py scripts/hana-smart-blank-templates-qa.py
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Add Smart and truly Blank Templates"
          git push origin HEAD:main
