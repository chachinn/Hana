name: Hana skincare table and note swipe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hana:
    if: github.event.head_commit.message == 'Run Hana skincare table and note swipe release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply update
        run: python scripts/hana-skincare-table-note-swipe-patch.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Run QA
        run: python scripts/hana-skincare-table-note-swipe-qa.py

      - name: Repository consistency checks
        shell: bash
        run: |
          grep -q 'hana-app-version" content="2.0.28"' index.html
          grep -q 'data-hana-version>2</span>' index.html
          grep -q 'hana-shell-v61' service-worker.js
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "hana-release-bot@users.noreply.github.com"
          git rm .github/workflows/hana-skincare-table-note-swipe.yml scripts/hana-skincare-table-note-swipe-patch.py scripts/hana-skincare-table-note-swipe-qa.py
          git add app.js index.html style.css service-worker.js
          git diff --cached --check
          git commit -m "Make skincare editor table-like and add note swipe delete"
          git push origin HEAD:main
