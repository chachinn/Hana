name: Hana startup hotfix recovery

on:
  push:
    paths:
      - '.github/workflows/hana-startup-hotfix-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply tested startup repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          def one(text,old,new,label):
              if text.count(old)!=1: raise SystemExit(f'{label}: {text.count(old)} matches')
              return text.replace(old,new,1)
          def rx(text,pat,repl,label):
              out,n=re.subn(pat,lambda _m:repl,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: {n} matches')
              return out
          p=Path('app.js'); app=p.read_text()
          app=one(app,'HANA 🌸 Version 2 · internal build 2.0.36\n   Smart Library + file-aware Smart Sort','HANA 🌸 Version 2 · internal build 2.0.37\n   Startup stability + browser runtime QA','header')
          app=one(app,'const HANA_APP_VERSION = "2.0.36";','const HANA_APP_VERSION = "2.0.37";','version')
          release='''const HANA_RELEASE_NOTES = {
            version: HANA_DISPLAY_VERSION,
            date: "August 14, 2026",
            title: "A sturdier Hana 🌸",
            intro: "This update fixes a startup regression from the Smart Library release and strengthens Hana’s release checks so browser-runtime failures are caught before deployment.",
            items: [
              { icon:"🛠️", title:"Blank startup fixed", text:"The template expansion no longer references a later JavaScript constant during startup, so Today can render normally again." },
              { icon:"📱", title:"Browser-runtime QA", text:"Hana is now tested in an iPhone-sized browser in addition to JavaScript syntax checks." },
              { icon:"🧩", title:"Smart Library preserved", text:"Expanded Smart Sort, file import and templates remain intact." },
              { icon:"🌿", title:"Data-safe repair", text:"No saved Hana data is cleared or replaced by this repair." }
            ]
          };'''
          app=rx(app,r'const HANA_RELEASE_NOTES = \{.*?\n\};',release,'release notes')
          old='''const SMART_PRESET_TRACKERS = {
            "travel-itinerary": EXTRA_TABLE_TEMPLATE_DEFINITIONS["travel-itinerary"], workout: EXTRA_TABLE_TEMPLATE_DEFINITIONS["workout-plan"], "study-plan": EXTRA_TABLE_TEMPLATE_DEFINITIONS["study-plan"],
            medication: EXTRA_TABLE_TEMPLATE_DEFINITIONS["medication-schedule"], "meal-plan": EXTRA_TABLE_TEMPLATE_DEFINITIONS["meal-planner"], "habit-tracker": EXTRA_TABLE_TEMPLATE_DEFINITIONS["habit-tracker"],
            "reading-list": EXTRA_TABLE_TEMPLATE_DEFINITIONS["reading-list"], "watch-list": EXTRA_TABLE_TEMPLATE_DEFINITIONS["watch-list"], subscriptions: EXTRA_TABLE_TEMPLATE_DEFINITIONS["subscription-tracker"],
            applications: EXTRA_TABLE_TEMPLATE_DEFINITIONS["application-tracker"], deliveries: EXTRA_TABLE_TEMPLATE_DEFINITIONS["delivery-tracker"], inventory: EXTRA_TABLE_TEMPLATE_DEFINITIONS["home-inventory"],
            "content-calendar": EXTRA_TABLE_TEMPLATE_DEFINITIONS["content-calendar"], "decision-log": EXTRA_TABLE_TEMPLATE_DEFINITIONS["decision-log"], bookmarks: EXTRA_TABLE_TEMPLATE_DEFINITIONS["bookmark-library"]
          };'''
          new='''const SMART_PRESET_TEMPLATE_IDS = {
            "travel-itinerary":"travel-itinerary", workout:"workout-plan", "study-plan":"study-plan",
            medication:"medication-schedule", "meal-plan":"meal-planner", "habit-tracker":"habit-tracker",
            "reading-list":"reading-list", "watch-list":"watch-list", subscriptions:"subscription-tracker",
            applications:"application-tracker", deliveries:"delivery-tracker", inventory:"home-inventory",
            "content-calendar":"content-calendar", "decision-log":"decision-log", bookmarks:"bookmark-library"
          };
          function smartPresetTrackerDefinition(kind){const templateId=SMART_PRESET_TEMPLATE_IDS[kind];return templateId?EXTRA_TABLE_TEMPLATE_DEFINITIONS[templateId]:null;}'''
          app=one(app,old,new,'preset initialization')
          app=one(app,'String(SMART_PRESET_TRACKERS[kind]?.name||"")','String(smartPresetTrackerDefinition(kind)?.name||"")','name lookup')
          app=one(app,'const definition=SMART_PRESET_TRACKERS[kind];','const definition=smartPresetTrackerDefinition(kind);','definition lookup')
          app=one(app,'if(SMART_PRESET_TRACKERS[kind])return createSmartPresetTracker(text,space,kind,options);','if(smartPresetTrackerDefinition(kind))return createSmartPresetTracker(text,space,kind,options);','route lookup')
          p.write_text(app)
          ip=Path('index.html'); index=ip.read_text().replace('content="2.0.36"','content="2.0.37"').replace('style.css?v=2.0.36','style.css?v=2.0.37').replace('app.js?v=2.0.36','app.js?v=2.0.37'); ip.write_text(index)
          sp=Path('service-worker.js'); sw=sp.read_text(); sw=one(sw,'HANA 🌸 Service Worker v69 · Smart Library release','HANA 🌸 Service Worker v70 · startup stability hotfix','sw header'); sw=one(sw,'const CACHE_NAME = "hana-shell-v69";','const CACHE_NAME = "hana-shell-v70";','cache'); sw=sw.replace('style.css?v=2.0.36','style.css?v=2.0.37').replace('app.js?v=2.0.36','app.js?v=2.0.37'); sp.write_text(sw)
          PY
      - name: Syntax and regression checks
        run: |
          node --check app.js
          ! grep -q 'SMART_PRESET_TRACKERS' app.js
          grep -q 'const HANA_APP_VERSION = "2.0.37"' app.js
          grep -q 'hana-shell-v70' service-worker.js
          git diff --check
      - name: Browser dependency
        run: npm install --prefix /tmp/hana-pw --no-save --package-lock=false playwright-core
      - name: Start local app
        run: |
          python3 -m http.server 4173 > /tmp/hana-http.log 2>&1 &
          sleep 2
      - name: iPhone core-page runtime test
        env:
          NODE_PATH: /tmp/hana-pw/node_modules
        run: |
          node <<'NODE'
          const {chromium}=require('playwright-core'),fs=require('fs');const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);(async()=>{const b=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});const c=await b.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true});const p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(800);let t=await p.locator('#pageContent').innerText();if(!/Focus Bouquet|Nothing urgent|active/i.test(t))throw Error('Today blank');for(const [x,m] of [['tasks','Tasks'],['lists','Lists'],['calendar','Calendar'],['notes','Notes'],['tables','Trackers'],['inbox','Brain Dump'],['templates','Templates']]){await p.evaluate(v=>changePage(v),x);await p.waitForTimeout(60);t=await p.locator('#pageContent').innerText();if(!t.includes(m))throw Error(`${x} blank`)}if(errors.length)throw Error(errors.join(' | '));await b.close();console.log('Runtime QA passed');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Push only production app files
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html service-worker.js
          git commit -m "Hana: fix startup runtime regression"
          git push origin main
