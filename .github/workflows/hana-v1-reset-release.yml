name: Hana pre-release v1 reset

on:
  push:
    paths:
      - .github/workflows/hana-v1-reset-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset Hana versioning to first release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in [Path('app.js'), Path('index.html'), Path('style.css'), Path('service-worker.js'), Path('firebase-bridge.js')]:
              text = path.read_text()
              text = re.sub(r'2\.0\.\d+', '1.0.0', text)
              text = text.replace('Version 2', 'Version 1')
              path.write_text(text)

          app = Path('app.js')
          text = app.read_text()
          text = text.replace('const HANA_DISPLAY_VERSION = "2";', 'const HANA_DISPLAY_VERSION = "1";')
          text = text.replace('HANA 🌸 Version 1 · internal build 1.0.0', 'HANA 🌸 Version 1 · release 1.0.0')
          release = '''const HANA_RELEASE_NOTES = {
            version: HANA_DISPLAY_VERSION,
            date: "August 15, 2026",
            title: "Welcome to Hana v1 🌸",
            intro: "This is Hana’s first complete release baseline. Everything built during pre-release development now belongs to Version 1, with the full planner, notes, routines, Smart Sort, packing, customization, safety and optional cloud features included from day one.",
            items: [
              { icon:"🌷", title:"Plan your days your way", text:"Today, Tasks, Focus Bouquet, Calendar, Agenda, Reminders, Time Pockets, Rescue My Day, Daily Close, recurring tasks and projects work together without forcing you into one planning style." },
              { icon:"📝", title:"Notes, lists, trackers & templates", text:"Build flexible notes, meeting records, checklists, living tables and reusable templates with blank-friendly defaults, custom fields, custom columns and project connections." },
              { icon:"✨", title:"Smart Capture & Smart Sort", text:"Drop in messy text or structured content and Hana can recognize tasks, notes, meetings, projects, trackers, groceries, packing lists and skincare routines while keeping larger documents together when needed." },
              { icon:"🧳", title:"Packing that gets smarter", text:"Packing uses 21 travel categories, editable category choices, custom categories and a local learning dictionary that remembers the corrections you make for future lists." },
              { icon:"🧴", title:"Weekly skincare planning", text:"Paste natural AM/PM routines, grouped weekdays, daily routines and exceptions; Hana turns them into a weekly skincare planner with a time-aware Today shortcut." },
              { icon:"☁️", title:"Private first, cloud when you want it", text:"Hana stays local-first with autosave, safety snapshots, Trash and JSON backup. Optional sign-in adds Firebase cloud backup and selective Partner sharing without making an account mandatory." },
              { icon:"🎀", title:"Made to be yours", text:"Customize themes, wallpaper, spaces, Quick Access, bottom navigation, categories, fields and practical defaults while keeping the interface calm and iPhone-friendly." }
            ]
          };'''
          pattern = r'const HANA_RELEASE_NOTES = \{.*?\n\};\n\nlet hanaAccountState'
          if not re.search(pattern, text, flags=re.S):
              raise SystemExit('Release note block not found')
          app.write_text(re.sub(pattern, release + '\n\nlet hanaAccountState', text, count=1, flags=re.S))

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = re.sub(r'HANA 🌸 Service Worker v\d+[^\n]*', 'HANA 🌸 Service Worker v1 · Hana Version 1 release', text, count=1)
          text = re.sub(r'const CACHE_NAME = "hana-shell-v\d+";', 'const CACHE_NAME = "hana-shell-v1";', text, count=1)
          sw.write_text(text)

          bridge = Path('firebase-bridge.js')
          text = bridge.read_text()
          text = re.sub(r'HANA 🌸 Firebase bridge v1\.0\.0[^\n]*', 'HANA 🌸 Firebase bridge v1.0.0 — Accounts, Cloud Backup & Partner Link', text, count=1)
          bridge.write_text(text)
          print('Hana Version 1 / 1.0.0 reset applied')
          PY

      - name: Static consistency QA
        run: |
          node --check app.js
          node --check firebase-bridge.js
          grep -q 'HANA 🌸 Version 1 · release 1.0.0' app.js
          grep -q 'const HANA_APP_VERSION = "1.0.0"' app.js
          grep -q 'const HANA_DISPLAY_VERSION = "1"' app.js
          grep -q 'Welcome to Hana v1' app.js
          grep -q 'hana-app-version" content="1.0.0"' index.html
          grep -q 'style.css?v=1.0.0' index.html
          grep -q 'app.js?v=1.0.0' index.html
          grep -q 'firebase-bridge.js?v=1.0.0' index.html
          grep -q 'hana-shell-v1' service-worker.js
          grep -q 'app.js?v=1.0.0' service-worker.js
          grep -q 'firebase-bridge.js?v=1.0.0' service-worker.js
          grep -q 'const BRIDGE_VERSION = "1.0.0"' firebase-bridge.js
          if grep -RInE --exclude-dir=.git 'Version 2|2\.0\.[0-9]+|hana-shell-v(7[4-9]|[89][0-9]|[1-9][0-9]{2,})' app.js index.html style.css service-worker.js firebase-bridge.js; then
            echo 'Old 2.x/version references remain' >&2
            exit 1
          fi
          git diff --check

      - name: Install lightweight browser driver
        run: npm install --prefix /tmp/hana-v1-pw --no-save --package-lock=false playwright-core

      - name: Start Hana locally
        run: |
          python3 -m http.server 4173 > /tmp/hana-v1-http.log 2>&1 &
          sleep 2

      - name: iPhone-sized Version 1 behavioral QA
        env:
          NODE_PATH: /tmp/hana-v1-pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!executablePath) throw new Error('No browser executable found');
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox']});
            const context = await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error.stack||error)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            await page.evaluate(()=>{try{closeModal('accountWelcomeModal');}catch(_error){document.getElementById('accountWelcomeModal')?.classList.add('hidden');}});
            const identity = await page.evaluate(()=>({app:HANA_APP_VERSION,display:HANA_DISPLAY_VERSION,release:HANA_RELEASE_NOTES.version,title:HANA_RELEASE_NOTES.title,storage:STORAGE_KEY,backup:BACKUP_DB_NAME,meta:document.querySelector('meta[name="hana-app-version"]')?.content||''}));
            if(identity.app!=='1.0.0'||identity.display!=='1'||identity.release!=='1'||identity.meta!=='1.0.0')throw new Error('Version 1 identity mismatch: '+JSON.stringify(identity));
            if(identity.storage!=='hana_app_v1'||identity.backup!=='hana_safety_backups_v1')throw new Error('Data keys changed during version reset');
            await page.evaluate(()=>renderWhatsNew());
            if(await page.locator('#whatsNewTitle').innerText()!=="What's new in Hana v1")throw new Error('What’s New still shows old version');
            const pages=[['tasks','Tasks'],['lists','Lists'],['calendar','Calendar'],['notes','Notes'],['tables','Trackers'],['projects','Projects'],['inbox','Brain Dump'],['templates','Templates'],['settings','Settings']];
            for(const [name,marker] of pages){await page.evaluate(pageName=>changePage(pageName),name);await page.waitForTimeout(70);const text=await page.locator('#pageContent').innerText();if(!text.includes(marker))throw new Error(`${name} failed to render`);}
            const preserved=await page.evaluate(()=>{state.settings.tutorialCompleted=true;state.settings.lastSeenUpdateVersion='2.0.41';state.notes.push(normalizeNote({id:'v1-reset-safety-note',title:'Version reset safety',type:'note',space:'personal',content:'keep me',createdAt:Date.now(),updatedAt:Date.now()}));saveState({snapshot:false});return localStorage.getItem(STORAGE_KEY)?.includes('v1-reset-safety-note');});
            if(!preserved)throw new Error('Could not persist pre-reset-style state');
            await page.reload({waitUntil:'domcontentloaded'});await page.waitForTimeout(700);
            const afterReload=await page.evaluate(()=>({hasNote:state.notes.some(n=>n.id==='v1-reset-safety-note'),lastSeen:state.settings.lastSeenUpdateVersion,app:HANA_APP_VERSION,future:isNewerHanaVersion('1.0.1','1.0.0')}));
            if(!afterReload.hasNote||afterReload.lastSeen!=='2.0.41'||afterReload.app!=='1.0.0'||afterReload.future!==true)throw new Error('Version reset data compatibility failed: '+JSON.stringify(afterReload));
            const packing=await page.evaluate(()=>Object.fromEntries(smartListItemsFromText(['Travel packing','Passport','Sunscreen','USB-C Cable'].join('\n'),'packing').map(item=>[item.title,item.detail])));
            if(packing.Passport!=='🪪 Documents & Money'||packing.Sunscreen!=='✨ Skincare & Sun Care'||packing['USB-C Cable']!=='🔌 Chargers & Power')throw new Error('Smart Packing regressed');
            if(errors.length)throw new Error('Browser runtime errors: '+errors.join(' | '));
            await browser.close();
            console.log('Hana Version 1 behavioral QA passed', JSON.stringify({identity,afterReload,packing}));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Commit Version 1 production files
        run: |
          git config user.name "Hana Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js firebase-bridge.js
          git diff --check --cached
          git commit -m "Hana: reset pre-release versioning to v1.0.0"
          git push origin main
